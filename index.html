<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IQC Sysmex UC-1000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Prompt:wght@500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#EAF4F4; --card:#FFFFFF; --soft:#F3F9F9; --ink:#1E3A3F; --mute:#587378; --line:#D2E4E5;
  --pri:#126B73; --sec:#178C91; --deep:#0D4F56; --on-pri:#FFFFFF;
  --Lt:#D3ECEC; --Lc:#0D4F56; --Ht:#E8E7F5; --Hc:#58539A;
  --ok:#23845D; --okbg:#DFF1E8; --okline:#98CDB3;
  --warn:#B07414; --warnbg:#F8EEDA; --warnline:#E0A13A;
  --bad:#D65362; --badbg:#FAE3E6; --badline:#EBA6AE;
  --shadow:0 14px 30px -20px rgba(21,86,107,.5);
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;--fh:'Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1D20; --card:#132A2E; --soft:#102428; --ink:#E1EFEF; --mute:#8FADB0; --line:#244349;
  --pri:#2FB0B5; --sec:#5CC6CC; --deep:#8FE0E4; --on-pri:#062A2E;
  --Lt:#1B4A50; --Lc:#8FE0E4; --Ht:#2E2C52; --Hc:#B9B5F0;
  --ok:#5CC495; --okbg:#173A2D; --okline:#2C6A50;
  --warn:#EDB55E; --warnbg:#3A3017; --warnline:#8A6A22;
  --bad:#EE7A88; --badbg:#442029; --badline:#7C3A41;
  --shadow:0 14px 30px -20px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0C1D20; --card:#132A2E; --soft:#102428; --ink:#E1EFEF; --mute:#8FADB0; --line:#244349;
  --pri:#2FB0B5; --sec:#5CC6CC; --deep:#8FE0E4; --on-pri:#062A2E;
  --Lt:#1B4A50; --Lc:#8FE0E4; --Ht:#2E2C52; --Hc:#B9B5F0;
  --ok:#5CC495; --okbg:#173A2D; --okline:#2C6A50;
  --warn:#EDB55E; --warnbg:#3A3017; --warnline:#8A6A22;
  --bad:#EE7A88; --badbg:#442029; --badline:#7C3A41;
  --shadow:0 14px 30px -20px rgba(0,0,0,.7); color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
.hero h1,h2,.btn,.chip,.sc,.tag,.gbox h2,.sec>summary b,.crow>summary b,.sh-top h2,.step-title,.ptitle{font-family:var(--fh)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;flex:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== หัวหน้า: หน้าแรกเป็นแบนเนอร์ ส่วนหน้าอื่นเป็นแถบเล็ก ===== */
.hero{background:linear-gradient(140deg,#0D4F56 0%,#126B73 62%,#178C91 100%);color:#fff;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:240px;height:240px;right:-70px;top:-90px}
.hero:after{width:150px;height:150px;left:-50px;bottom:-60px}
.hero .wrap{position:relative;z-index:1;padding-block:6px 50px}
.hrow{display:flex;align-items:center;justify-content:flex-end;margin-bottom:8px;gap:10px}
.mark{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;flex:none}
.mark .ic{width:24px;height:24px}
.greet{font-size:13px;background:rgba(255,255,255,.18);border-radius:99px;padding:5px 12px;font-weight:500}
.eyebrow{margin:0 0 6px;font-weight:600;font-size:14px;opacity:.85;letter-spacing:.02em}
.hero h1{margin:0;font-size:clamp(22px,6.4vw,28px);line-height:1.25;font-weight:700;text-wrap:balance}
.hsub{margin:6px 0 0;font-size:14px;opacity:.9}
.bar{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{padding-block:10px 4px}
.brow{display:flex;align-items:center;gap:10px}
.bar .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#0D4F56,#178C91)}
.bar .mark .ic{width:20px;height:20px}
.bt{min-width:0;flex:1}
.bt b{display:block;font-size:16px;line-height:1.2}
.bt span{font-size:12px;color:var(--mute)}
.cnts{display:flex;gap:6px;flex:none}
.cp{font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--mute);border:1.5px solid var(--line)}
.cp.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.cp.full{background:var(--ok);border-color:var(--ok);color:#fff}
.rail{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.seg{border:0;background:none;padding:8px 0;cursor:pointer}
.seg i{display:block;height:6px;border-radius:6px;background:var(--line);transition:background .2s}
.seg.ok i{background:var(--ok)} .seg.bad i{background:var(--bad)}
.seg:focus-visible{outline:2px solid var(--pri);outline-offset:1px;border-radius:6px}

main{padding-block:18px 190px}
.pull{margin-top:-46px;position:relative;z-index:2}
.page{animation:rise .24s ease-out}
@keyframes rise{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}*{transition:none!important;animation:none!important}}
.h2{margin:0;font-size:clamp(22px,6.4vw,27px);line-height:1.25;font-weight:700}
.sub{margin:3px 0 0;color:var(--mute);font-size:14px}

/* ===== หน้าแรก ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:11px 14px;min-width:0;cursor:pointer}
.tile small,.fcard small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);font-weight:600}
.tile b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.tile input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;background:none}
.tile input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.tile:focus-within,.fcard:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
.fcard{display:flex;flex-direction:column;gap:2px;margin-top:10px;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:11px 14px}
.bare{font-family:inherit;color:var(--fg);width:100%;border:0;background:none;padding:2px 0;font-size:19px;font-weight:600;outline:none;min-width:0}
.bare::placeholder{color:var(--mute);opacity:.55;font-weight:400}
.hint{margin:6px 2px 0;font-size:12.5px;color:var(--mute)}
.lotcard{display:flex;align-items:center;gap:12px;margin-top:10px;border-radius:16px;padding:12px 12px 12px 14px;background:linear-gradient(135deg,var(--Lt),var(--soft));border:1.5px solid var(--line)}
.lotcard .li{width:40px;height:40px;border-radius:12px;background:var(--card);color:var(--pri);display:grid;place-items:center;flex:none}
.lotcard .lt{flex:1;min-width:0}
.lotcard small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.lotcard b{display:block;font-size:20px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addname{margin-top:8px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;border-radius:13px;border:1.5px dashed var(--line);background:none;color:var(--pri);font-weight:700;cursor:pointer;font-size:15px;font-family:var(--fh)}
.addname .ic{width:18px;height:18px}
.mini{font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--pri);border-radius:11px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.gear{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;cursor:pointer}
.gear .ic{width:22px;height:22px}
.gear:focus-visible{outline:2px solid #fff;outline-offset:2px}
select.bare{appearance:none;-webkit-appearance:none;background:none;cursor:pointer;padding-right:24px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 12px) 55%,calc(100% - 7px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.gate{position:fixed;inset:0;z-index:60;background:rgba(10,30,38,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px}
.gbox{position:relative;overflow:hidden;background:var(--card);border-radius:30px;padding:0;max-width:360px;width:100%;text-align:center;animation:pop .3s cubic-bezier(.2,1.2,.4,1);box-shadow:0 30px 60px -28px rgba(0,0,0,.55)}
.gh{position:relative;overflow:hidden;height:150px;padding:30px 20px 0;color:#fff;background:linear-gradient(135deg,#126B73,#178C91)}
.gh i{position:absolute;border-radius:50%}
.gh .c1{width:120px;height:120px;left:-38px;bottom:-34px;background:#F2B26B;opacity:.9}
.gh .c2{width:104px;height:104px;right:-32px;bottom:-28px;background:#3FB08A;opacity:.9}
.gbox h2{position:relative;margin:0;font-size:24px;color:#fff}
.gi{position:relative;width:48px;height:48px;border-radius:15px;margin:0 auto 10px;display:grid;place-items:center;background:rgba(255,255,255,.2);color:#fff}
.gi svg{width:26px;height:26px}
.gb{position:relative;margin-top:-30px;background:var(--card);border-radius:30px 30px 0 0;padding:24px 22px 20px}
.gb .sub{margin:0}
.gpw{display:flex;align-items:stretch;margin-top:16px;background:var(--soft);border:1.5px solid transparent;border-radius:999px;overflow:hidden}
.gpw:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
.gin{flex:1;min-width:0;height:54px;border:0;background:transparent;padding:0 8px 0 22px;font-size:20px;text-align:left;letter-spacing:.12em;outline:none;color:var(--fg)}
.geye{flex:none;width:54px;border:0;background:transparent;color:var(--mute);display:grid;place-items:center;cursor:pointer}
.geye svg{width:22px;height:22px}
.gmsg{color:var(--bad);font-size:13px;min-height:1.3em;margin-top:8px}
.gbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;margin-top:6px}
.gbtns .btn{border-radius:999px}
.gbox .demo{margin:12px 0 0;font-size:12.5px;color:var(--warn);background:var(--warnbg);border-radius:10px;padding:8px 10px}
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sh-top{position:sticky;top:0;z-index:2;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.sh-top .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.sh-top h2{margin:0;font-size:19px;flex:1}
.iconbtn{width:42px;height:42px;border-radius:13px;border:1.5px solid var(--line);background:var(--soft);display:grid;place-items:center;cursor:pointer;color:var(--fg);flex:none}
.sh-body{padding-block:14px 130px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:12px;box-shadow:var(--shadow);overflow:hidden}
.sec>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:8px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg);transition:transform .2s;flex:none}
.sec[open]>summary:after{transform:rotate(-135deg)}
.sec>summary b{display:block;font-size:16px}
.sec>summary small{display:block;color:var(--mute);font-size:12.5px;font-weight:400}
.secb{padding:2px 16px 16px}
.crow{border-top:1px solid var(--line)}
.crow>summary{list-style:none;cursor:pointer;padding:11px 2px;display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:baseline}
.crow>summary::-webkit-details-marker{display:none}
.crow>summary b{font-size:16px}
.crow>summary span{color:var(--mute);font-size:13px}
.crow>summary small{grid-column:1/-1;color:var(--mute);font-size:12.5px}
.crow .secb{padding:0 2px 12px}
.lvblock{margin-top:10px}
.lvblock .tag{margin-bottom:8px}
.chipsr{display:flex;flex-wrap:wrap;gap:8px}
.sc{min-width:52px;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--soft);font-size:16px;font-weight:600;cursor:pointer;color:var(--fg)}
.sc.on{background:var(--ok);border-color:var(--ok);color:#fff}
.rg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rg label,.lab{display:block;font-size:12.5px;font-weight:600;color:var(--mute)}
.sin{width:100%;height:48px;margin-top:4px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft);padding:0 12px;font-size:17px;color:var(--fg)}
.sin:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
.lrow{display:flex;gap:8px;margin-top:8px}
.lrow .sin{margin-top:0;flex:1;min-width:0}
.lrow .iconbtn{height:48px;width:48px;color:var(--bad)}
.addbtn{margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:46px;border-radius:13px;border:1.5px dashed var(--line);background:none;color:var(--pri);font-weight:700;cursor:pointer;font-size:15px}
.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 4px;font-size:14.5px}
.tgl input{width:46px;height:26px;appearance:none;-webkit-appearance:none;border-radius:99px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none}
.tgl input:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl input:checked{background:var(--ok)}
.tgl input:checked:after{transform:translateX(20px)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper .sin{text-align:center;width:90px;margin-top:0;font-weight:700}
.stepper .iconbtn{width:48px;height:48px;font-size:22px;font-weight:700}
.sh-dock{position:fixed;left:0;right:0;bottom:0;z-index:3;padding:26px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.sh-dock .in{max-width:528px;margin:0 auto}
.sh-dock .btn{width:100%}
.infonote{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--mute);margin-top:12px;padding:0 4px}
.plabel{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px}
.branches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.br{min-height:50px;border:1.5px solid var(--line);background:var(--soft);border-radius:15px;font-size:16px;font-weight:700;cursor:pointer;color:var(--fg);padding:0 4px;transition:transform .1s,background .15s}
.br:active{transform:scale(.96)}
.br.on{background:linear-gradient(135deg,#0D4F56,#126B73 55%,#178C91) border-box;border-color:transparent;color:#fff;box-shadow:0 10px 18px -12px var(--pri)}
.lotcard .exp{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.lotcard .exp em{font-style:normal;font-weight:700}
.lotcard.warn{background:linear-gradient(135deg,var(--warnbg),var(--soft));border-color:var(--warnline)}
.lotcard.warn .exp em{color:var(--warn)}
.lotcard.bad{background:linear-gradient(135deg,var(--badbg),var(--soft));border-color:var(--badline)}
.lotcard.bad .exp em{color:var(--bad)}
.lotcard{margin-top:0;margin-bottom:8px}
.editbox{border:1.5px dashed var(--line);border-radius:16px;padding:10px;margin-bottom:8px}
.editbox .et{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--pri);margin:0 2px 8px}
.editbox .fcard{margin-top:0}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 12px;min-width:0}
.stp i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-style:normal;font-weight:700;font-size:13px;margin-bottom:6px}
.stp:nth-child(1) i{background:var(--Lt);color:var(--Lc)}
.stp:nth-child(2) i{background:var(--Ht);color:var(--Hc)}
.stp:nth-child(3) i{background:var(--okbg);color:var(--ok)}
.stp b{display:block;font-size:13.5px;line-height:1.25}
.stp span{font-size:12px;color:var(--mute);line-height:1.3;display:block;margin-top:1px}

/* ===== หัวข้อ Control + การ์ดรายการ ===== */
.band{display:flex;align-items:center;gap:14px;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.band.L{background:var(--Lt);color:var(--Lc)} .band.H{background:var(--Ht);color:var(--Hc)}
.band .bl{width:52px;height:52px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:28px;font-weight:700;flex:none}
.band h2{margin:0;font-size:23px;line-height:1.2}
.band p{margin:2px 0 0;font-size:13.5px;opacity:.9}
.item{position:relative;overflow:hidden;scroll-margin-top:170px;scroll-margin-bottom:130px}
.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acc)}
.item.L{--acc:var(--sec)} .item.H{--acc:#8E89D0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 16px 16px 20px;margin-top:12px;box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.card.ok{border-color:var(--okline);background:linear-gradient(var(--okbg),var(--okbg)),var(--card)}
.card.bad{border-color:var(--badline);background:linear-gradient(var(--badbg),var(--badbg)),var(--card)}
.card.miss{border-color:var(--warnline);background:var(--warnbg)}
.ch{display:flex;align-items:center;gap:10px}
.num{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--mute);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;border:1px solid var(--line)}
.ih{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 10px;min-width:0;flex:1}
.ih b{font-size:22px;font-weight:700}
.ih span{color:var(--mute);font-size:13.5px}
.st{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;min-height:24px;flex:none}
.st.ok{color:var(--ok)} .st.bad{color:var(--bad)}
.crit{display:flex;align-items:center;gap:6px;margin:10px 0 12px;font-size:13.5px;color:var(--mute)}
.crit b{color:var(--ink);font-weight:600}
.chips{display:grid;gap:8px}
.chip{min-height:58px;border:1.5px solid var(--line);background:var(--soft);border-radius:15px;font-size:clamp(17px,5vw,20px);font-weight:600;cursor:pointer;transition:transform .1s,background .15s,border-color .15s;padding:0 4px}
.chip:active{transform:scale(.95)}
.chip:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.card.ok .chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.card.bad .chip.on{background:var(--bad);border-color:var(--bad);color:#fff}
.field{width:100%;height:62px;border:1.5px solid var(--line);border-radius:15px;padding:0 16px;background:var(--soft);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s}
textarea.field{height:auto;padding:12px 14px;resize:vertical;min-height:90px;line-height:1.5;font-size:16px;font-weight:400}

<script>
/* ---------- เกณฑ์ผ่าน (เรียงตามไฟล์ QC_Urine.xlsx) ---------- */
const S=['Negative','Trace','1+','2+','3+','4+'];

let P=[
 {k:'URO',ab:'URO',name:'Urobilinogen',opts:['Normal','1+','2+','3+','4+'],L:['Normal'],H:['1+','2+','3+','4+']},
 {k:'BLD',ab:'BLD',name:'Blood',opts:S,L:['Negative'],H:['1+','2+','3+']},

/* ---------- ตัดสินผ่าน/ไม่ผ่าน: true / false / null ---------- */
function judge(p,l){
  const v=state.vals[l][p.k];
  if(v===undefined||v==='')return null;
  if(p.num){const n=parseFloat(v);if(isNaN(n))return null;const[a,b]=p[l];return n>=a-1e-9&&n<=b+1e-9;}
  return p[l].includes(v);
}
const rangeText=(p,l)=>p.num?p[l][0].toFixed(p.dec)+' – '+p[l][1].toFixed(p.dec):p[l].join('   /   ');
function stat(){
  const fails={L:[],H:[]},cnt={L:0,H:0};
  P.forEach(p=>LV.forEach(l=>{const j=judge(p,l);if(j!==null)cnt[l]++;if(j===false)fails[l].push(p.ab);}));
  return{filled:cnt.L+cnt.H,fails,cnt};
}
function firstMissing(){
  for(const l of LV){const i=P.findIndex(p=>judge(p,l)===null);if(i>=0)return{l,i};}
  return null;
}

/* ---------- แถบล่าง ---------- */
function paintDock(){
  const b=$('back'),n=$('next'),ds=$('dsum'),st=stat(),l0=lvOf();
  if(state.step===0)ds.hidden=true;
  else{
    ds.hidden=false;
    const fl=l0?st.fails[l0]:[].concat(st.fails.L.map(x=>'L '+x),st.fails.H.map(x=>'H '+x));
    const cnt=l0?st.cnt[l0]:st.filled,tot=l0?N:TOTAL;
    ds.className='dsum '+(fl.length?'bad':cnt===tot?'ok':'');
    ds.innerHTML='<i></i><span><b>กรอกแล้ว '+cnt+'/'+tot+'</b>'+(cnt<tot?' · เหลือ '+(tot-cnt):'')+'</span><span class="dr">'+(fl.length?'ไม่ผ่าน '+esc(fl.join(', ')):(cnt?'ผ่านทุกรายการที่กรอก':''))+'</span>';
  }
  b.hidden=state.step===0||(state.rerun&&state.step===rrSteps()[0]);
  $('dockin').classList.toggle('solo',b.hidden);
  b.innerHTML=ic('left');
  n.disabled=state.saving||!ready;
  if(state.step===0)n.innerHTML='<span>เริ่มกรอก Control-L</span>'+ic('right');
  else if(state.step===1)n.innerHTML='<span>'+(rrSteps().includes(2)?'ไปกรอก Control-H':'สรุปผล')+'</span>'+ic('right');
  else if(state.step===2)n.innerHTML='<span>สรุปผล</span>'+ic('right');
  else n.innerHTML=ic('save')+'<span>'+(state.saving?'กำลังบันทึก...':'บันทึกผล')+'</span>';
}

function statHTML(j){return j===null?'':j?ic('check')+'ผ่าน':ic('x')+'ไม่ผ่าน';}
function rbHTML(p,l,i){
  const[a,b]=p[l],sp=b-a,mn=a-sp*.7,mx=b+sp*.7,pc=x=>+((x-mn)/(mx-mn)*100).toFixed(1);
  return '<div class="rb" aria-hidden="true"><i class="bd" style="left:'+pc(a)+'%;width:'+(pc(b)-pc(a))+'%"></i><u class="mk" id="m-'+i+'" hidden></u></div>'+
    '<div class="rbl" aria-hidden="true"><span style="left:'+pc(a)+'%">'+a.toFixed(p.dec)+'</span><span style="left:'+pc(b)+'%">'+b.toFixed(p.dec)+'</span></div>';
}
function patchMark(i,l){
  const p=P[i];if(!p.num)return;const m=$('m-'+i);if(!m)return;
  const n=parseFloat(state.vals[l][p.k]);if(isNaN(n)){m.hidden=true;return;}
  const[a,b]=p[l],sp=b-a,mn=a-sp*.7,mx=b+sp*.7;
  m.hidden=false;m.style.left=Math.max(2,Math.min(98,(n-mn)/(mx-mn)*100))+'%';
}
function chipCols(o){
  const n=o.length,long=Math.max(...o.map(x=>x.length))>=5;
  if(n>=5&&long)return 'repeat(3,1fr)';
  if(n>=7)return 'repeat(4,1fr)';
  return o.map(x=>x.length>2?'1.9fr':'1fr').join(' ');
}
function itemHTML(p,l,i){
  const j=judge(p,l),v=state.vals[l][p.k];
  const cls=j===true?' ok':j===false?' bad':(state.showMiss&&j===null?' miss':'');
  let inp;
  if(p.num){
    inp='<input class="field" id="n-'+i+'" type="number" inputmode="decimal" step="any" placeholder="'+p.ph+'" value="'+(v===undefined?'':esc(v))+'" aria-label="'+p.ab+' Control-'+l+'">'+rbHTML(p,l,i);
  }else{
    inp='<div class="chips" style="grid-template-columns:'+chipCols(p.opts)+'">'+
      p.opts.map(o=>'<button type="button" class="chip'+(v===o?' on':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';
  }
  return '<div class="card item '+l+cls+'" id="c-'+i+'" data-i="'+i+'"><div class="ch"><span class="num">'+(i+1)+'</span><div class="ih"><b>'+p.ab+'</b><span>'+p.name+'</span></div>'+
    '<span class="st '+(j===true?'ok':j===false?'bad':'')+'" id="s-'+i+'">'+statHTML(j)+'</span></div>'+
    '<p class="crit">'+ic('target')+'<span>เกณฑ์ผ่าน <b>'+rangeText(p,l)+'</b></span></p>'+inp+'</div>';
}
function viewLevel(l){
  const toH=l==='L'&&rrSteps().includes(2),next=toH?'Control-H':'สรุปผล';
  return '<section class="page">'+fixBar()+'<div class="band '+l+'"><div class="bl">'+l+'</div><div><h2>Control-'+l+'</h2><p>'+(l==='L'?'ระดับต่ำ (Low)':'ระดับสูง (High)')+' · กรอกให้ครบ '+N+' รายการ แล้วไปต่อที่ '+next+'</p></div></div>'+
    P.map((p,i)=>itemHTML(p,l,i)).join('')+
    '<div class="note" id="endn" hidden>'+ic('check')+'<span>กรอกครบ '+N+' รายการแล้ว กด “'+(toH?'ไปกรอก Control-H':'สรุปผล')+'” ด้านล่างได้เลย</span></div></section>';
}
function patchCard(i,l){
  const j=judge(P[i],l),c=$('c-'+i);if(!c)return;
  const was=c.classList.contains('bad');
  c.classList.toggle('ok',j===true);c.classList.toggle('bad',j===false);c.classList.remove('miss');
  if(j===false&&!was){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),700);}  // สั่นครั้งเดียวตอนเพิ่งเปลี่ยนเป็นไม่ผ่าน
  const st=$('s-'+i);st.className='st '+(j===true?'ok':j===false?'bad':'');st.innerHTML=statHTML(j);
  patchMark(i,l);
}
function patchEnd(){
  const l=lvOf(),e=$('endn');
  if(l&&e)e.hidden=stat().cnt[l]<N;
}
function scrollToItem(i){const el=$('c-'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
function scrollNext(i,l){
  let j=-1;
  for(let k=i+1;k<N;k++){if(judge(P[k],l)===null){j=k;break;}}
  if(j<0)j=P.findIndex(p=>judge(p,l)===null);
  if(j>=0)scrollToItem(j);
  else{const e=$('endn');if(e)e.scrollIntoView({behavior:'smooth',block:'center'});}
}

/* ---------- หน้า 3: สรุป ---------- */
function cell(p,i,l){
  const j=judge(p,l),v=state.vals[l][p.k];
  const body=j===null?'–':ic(j?'check':'x')+esc(v);
  return'<button type="button" class="pill '+(j===null?'':j?'ok':'bad')+'" data-jump="'+l+':'+i+'" aria-label="'+p.ab+' Control-'+l+'">'+body+'</button>';
}
function viewSummary(){
  const s=stat(),i=state.info;
  const miss=TOTAL-s.filled,nf=s.fails.L.length+s.fails.H.length;
  const vc=miss?'miss':nf?'bad':'ok';
  const vt=miss?'ยังกรอกไม่ครบ':nf?'มีรายการไม่ผ่าน':'ผ่านทุกรายการ';
  const vs=miss?'เหลืออีก '+miss+' ช่อง แตะช่องในตารางเพื่อกลับไปกรอก':nf?''+(state.rerun?'หลังกดบันทึกจะให้ระบุสาเหตุและการแก้ไข':'หลังบันทึกต้องกรอก QC ซ้ำอีกรอบ')+'':'ตรวจแล้วกดบันทึกผลได้เลย';
  const rc=l=>{
    const done=s.cnt[l]===N,bad=s.fails[l].length;
    const cls=!done?'miss':bad?'bad':'ok';
    const txt=!done?'ยังไม่ครบ':bad?'ไม่ผ่าน '+bad:'ผ่าน';
    const sm=!done?'กรอกแล้ว '+s.cnt[l]+' / '+N:bad?s.fails[l].join(', '):'ทุกรายการอยู่ในเกณฑ์';
    return'<div class="rc '+cls+'"><span class="tag '+l+'">'+ic('drop')+'Control-'+l+'</span><div class="big">'+ic(!done?'alert':bad?'x':'check')+txt+'</div><small>'+esc(sm)+'</small></div>';
  };
  const rows=P.map((p,k)=>'<div class="tr"><span><b>'+p.ab+'</b><em>'+p.name+'</em></span>'+cell(p,k,'L')+cell(p,k,'H')+'</div>').join('');
  return '<section class="page"><div class="verdict '+vc+'"><div class="vi">'+ic(miss?'alert':nf?'x':'check')+'</div><div><h2>'+vt+'</h2><p>'+vs+'</p></div></div>'+
    '<div class="meta"><span>'+ic('pin')+'สาขา'+esc(state.branch)+'</span><span>'+ic('cal')+thDate(i.date)+'</span><span>'+ic('clock')+thTime(i.time)+'</span><span>'+ic('user')+(esc(i.name)||'ยังไม่ระบุ')+'</span><span>'+ic('drop')+'Lot '+esc(state.setup.lot)+' · Exp '+thDate(state.setup.exp)+'</span><span>'+ic('strip')+'UC-10S '+esc(state.setup.slot)+' · Exp '+thDate(state.setup.sexp)+'</span></div>'+
    '<div class="res">'+rc('L')+rc('H')+'</div>'+
    '<div class="card tbl"><div class="th"><span>รายการ</span><span>L</span><span>H</span></div>'+rows+'</div>'+
    '</section>';
}

/* ---------- วาดหน้า / เปลี่ยนหน้า ---------- */
function render(){
  const l=lvOf();
  $('view').innerHTML=state.step===0?viewInfo():l?viewLevel(l):viewSummary();
  paintTop();paintDock();patchEnd();
  if(l)P.forEach((p,i)=>patchMark(i,l));
}
/* รอบกรอกซ้ำ: ไปเฉพาะ Control ที่ไม่ผ่าน (ระดับที่ผ่านแล้วใช้ค่ารอบแรก) */
const rrSteps=()=>state.rerun?state.rerun.lv.map(l=>l==='L'?1:2).concat(3):[0,1,2,3];
function go(n,noTop){
  n=Math.max(0,Math.min(3,n));
  if(state.rerun){
    const ok=rrSteps();
    if(!ok.includes(n)){
      if(n<ok[0])n=ok[0];
      else n=n>state.step?(ok.find(s=>s>n)||3):(ok.slice().reverse().find(s=>s<n)||ok[0]);
    }
  }
  state.step=n;
  state.showMiss=false;
  render();
  if(!noTop)window.scrollTo({top:0,behavior:'smooth'});
}
function goItem(l,i,markMiss){
  if(state.rerun&&!state.rerun.lv.includes(l)){toast('รอบนี้กรอกซ้ำเฉพาะ Control-'+state.rerun.lv.join(' และ '));return;}
  go(l==='L'?1:2,true);
  if(markMiss){
    state.showMiss=true;
    P.forEach((p,k)=>{if(judge(p,l)===null){const c=$('c-'+k);if(c)c.classList.add('miss');}});
  }
  setTimeout(()=>scrollToItem(i),60);
}
function toast(m){
  const t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---------- เพิ่มชื่อผู้บันทึกเข้ารายการ ---------- */
async function addName(){
  const n=String(state.info.name||'').replace(/\s+/g,' ').trim();
  if(!n)return toast('พิมพ์ชื่อก่อน');
  if(n.length>60)return toast('ชื่อยาวเกินไป');
  if(CFG.names.includes(n)){state.nameOther=false;state.info.name=n;render();return toast('มีชื่อนี้ในรายการแล้ว');}
  try{
    if(API_URL){const j=await post({action:'add_name',name:n});if(!j.ok)throw new Error(j.error||'เพิ่มชื่อไม่สำเร็จ');CFG.names=j.data.names;}
    else CFG.names.push(n);
    state.nameOther=false;state.info.name=n;render();toast('เพิ่มชื่อในรายการแล้ว');
  }catch(err){toast(err&&err.message||'เพิ่มชื่อไม่สำเร็จ');}
}

/* คอมพิวเตอร์: คลิกที่ไหนในช่องวันที่/เวลา ให้เปิดตัวเลือกทันที */
document.addEventListener('click',e=>{
  const i=e.target.closest('.tile input');
  if(i&&typeof i.showPicker==='function'){try{i.showPicker();}catch(err){}}
});

/* ---------- ฉบับร่างอัตโนมัติ: เก็บในเครื่อง ลบทิ้งเมื่อพ้นวัน/บันทึกสำเร็จ ---------- */
const DRAFT_KEY='qcDraft';
function draftGet(){
  try{const d=JSON.parse(localStorage.getItem(DRAFT_KEY)||'null');if(d&&d.day===todayISO())return d;localStorage.removeItem(DRAFT_KEY);}catch(e){}
  return null;
}
function draftClear(){try{localStorage.removeItem(DRAFT_KEY);}catch(e){}}
let _dt=0;
function draftSave(){
  clearTimeout(_dt);
  _dt=setTimeout(()=>{
    if(state.draft||state.rerun||state.saving||state.last||!$('done').hidden)return;   // รอผู้ใช้เลือกก่อน / ไม่เก็บตอนกรอกซ้ำหรือบันทึกแล้ว
    try{
      if(!stat().filled){draftClear();return;}
      localStorage.setItem(DRAFT_KEY,JSON.stringify({day:todayISO(),branch:state.branch,name:state.info.name,vals:state.vals,remark:state.remark,step:Math.min(3,Math.max(1,state.step))}));
    }catch(e){}
  },400);
}
function draftUse(){
  const d=state.draft;if(!d)return;
  state.vals={L:d.vals.L||{},H:d.vals.H||{}};state.remark=d.remark||'';
  if(d.name)state.info.name=d.name;
  if(d.branch&&CFG.branches.includes(d.branch)&&state.branch!==d.branch)selectBranch(d.branch);
  state.draft=null;
  go(d.step||1);toast('กู้คืนข้อมูลที่กรอกค้างไว้แล้ว');
}
['click','input','change'].forEach(t=>document.addEventListener(t,draftSave,true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)draftSave();});

/* ---------- เหตุการณ์ ---------- */
$('view').addEventListener('click',e=>{
  const act=e.target.closest('[data-act]');
  if(act){
    const k=act.dataset.act;
    if(k==='branch'){if(state.branch!==act.dataset.b)selectBranch(act.dataset.b);return;}
    if(k==='add-name'){addName();return;}
    if(k==='draft-use'){draftUse();return;}
    if(k==='draft-drop'){draftClear();state.draft=null;render();toast('ล้างข้อมูลที่กรอกค้างแล้ว');return;}
    if(k==='edit-re'){state.editRe=true;render();setTimeout(()=>{const f=$('f-lot');if(f){f.focus();f.select();}},50);return;}
    if(k==='edit-strip'){state.editStrip=true;render();setTimeout(()=>{const f=$('f-slot');if(f){f.focus();f.select();}},50);return;}
  }
  const j=e.target.closest('[data-jump]');
  if(j){const[l,i]=j.dataset.jump.split(':');goItem(l,+i,false);return;}
  const c=e.target.closest('.chip'),l=lvOf();
  if(c&&l){
    const card=c.closest('.item'),i=+card.dataset.i,p=P[i];
    const was=judge(p,l)!==null;
    state.vals[l][p.k]=c.dataset.v;
    card.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
    patchCard(i,l);paintTop();paintDock();patchEnd();
    if(!was)setTimeout(()=>{if(lvOf()===l)scrollNext(i,l);},380);
  }
});
$('view').addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-name-sel'){
    if(t.value==='__other'){state.nameOther=true;state.info.name='';render();setTimeout(()=>{const f=$('f-name');if(f)f.focus();},50);}
    else{state.nameOther=false;state.info.name=t.value;render();}
  }
});
$('view').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-date'){state.info.date=t.value;$('v-date').textContent=thDate(t.value);}
  else if(t.id==='f-time'){state.info.time=t.value;$('v-time').textContent=thTime(t.value);}
  else if(t.id==='f-name')state.info.name=t.value;
  else if(t.id==='f-lot')state.setup.lot=t.value;
  else if(t.id==='f-slot')state.setup.slot=t.value;
  else if(t.id==='f-exp'){state.setup.exp=t.value;$('v-f-exp').textContent=t.value?thDate(t.value):'เลือกวันที่';}
  else if(t.id==='f-sexp'){state.setup.sexp=t.value;$('v-f-sexp').textContent=t.value?thDate(t.value):'เลือกวันที่';}
  else if(t.id==='f-remark')state.remark=t.value;
  else if(t.id.slice(0,2)==='n-'&&lvOf()){
    const i=+t.id.slice(2),l=lvOf();
    state.vals[l][P[i].k]=t.value;patchCard(i,l);paintTop();paintDock();patchEnd();
  }
});
$('view').addEventListener('keydown',e=>{
  const t=e.target,l=lvOf();
  if(e.key==='Enter'&&l&&t.id&&t.id.slice(0,2)==='n-'){
    e.preventDefault();const i=+t.id.slice(2);
    if(judge(P[i],l)!==null){t.blur();scrollNext(i,l);}
  }
});
$('top').addEventListener('click',e=>{const g=e.target.closest('[data-scroll]');if(g)scrollToItem(+g.dataset.scroll);});
$('back').onclick=()=>go(state.step-1);
$('next').onclick=()=>{
  const l=lvOf();
  if(state.step===0){
    const ck=checkInfo();if(ck){toast(ck.m);if(ck.edit){state[ck.edit]=true;render();}return;}
    go(1);
  }else if(l){
    const s=stat();
    if(s.cnt[l]<N){
      const i=P.findIndex(p=>judge(p,l)===null);
      goItem(l,i,true);
      toast('Control-'+l+' ยังเหลือ '+(N-s.cnt[l])+' รายการ');
      return;
    }
    go(state.step+1);
  }else save();
};

/* ---------- ตรวจข้อมูลหน้าแรก ---------- */
function checkInfo(){
  const s=state.setup;
  if(!state.branch)return{m:'เลือกสาขาก่อน'};
  if(state.loadingSetup)return{m:'รอสักครู่ กำลังโหลดข้อมูล UC-Control'};
  if(!state.info.name.trim())return{m:'กรอกชื่อผู้บันทึกก่อน'};
  if(!s.lot.trim()||!s.exp)return{m:'กรอก Lot และ Exp ของ UC-Control ก่อน',edit:'editRe'};
  if(!s.slot.trim()||!s.sexp)return{m:'กรอก Lot และ Exp ของ Strip UC-10S ก่อน',edit:'editStrip'};
  return null;
}
/* ---------- บันทึก ---------- */
async function save(){
  if(state.saving)return;
  const i=state.info,s=stat();
  const ck=checkInfo();if(ck){toast(ck.m);go(0);return;}
  if(s.filled<TOTAL){const m=firstMissing();toast('ยังกรอกไม่ครบ '+(TOTAL-s.filled)+' ช่อง');goItem(m.l,m.i,true);return;}
  const su=state.setup;
  const data={branch:state.branch,date:i.date,time:i.time,name:i.name.trim(),lot:su.lot.trim(),exp:su.exp,slot:su.slot.trim(),sexp:su.sexp,remark:state.remark.trim(),
    L:{values:state.vals.L,fails:s.fails.L,pass:s.fails.L.length===0},
    H:{values:state.vals.H,fails:s.fails.H,pass:s.fails.H.length===0}};
  if(state.rerun){data.fixRound=state.rerun.round;if(state.rerun.lv.length===1)data.only=state.rerun.lv[0];}   // รอบกรอกซ้ำ (ถ้ากรอกซ้ำระดับเดียว เก็บแถวของระดับนั้น)
  try{localStorage.setItem('qcName',data.name);}catch(e){}
  state.saving=true;paintDock();
  try{
    let res;
    if(API_URL){
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',payload:data})});
      const j=await r.json();if(!j.ok)throw new Error(j.error||'บันทึกไม่สำเร็จ');res=j.data;
    }else{
      await new Promise(r=>setTimeout(r,600));res={tab:data.date.slice(0,7),demo:true};
    }
    showDone(data,res);
  }catch(err){
    toast('บันทึกไม่สำเร็จ: '+(err&&err.message?err.message:'ลองใหม่อีกครั้ง'));
  }finally{state.saving=false;paintDock();}
}
function resetForNew(){
  const keep=state.info.name;
  state.vals={L:{},H:{}};state.remark='';state.rerun=null;state.fxd=null;state.last=null;nowFill();state.info.name=keep;
  state.editRe=!(state.setup.lot&&state.setup.exp);state.editStrip=!(state.setup.slot&&state.setup.sexp);
}
function doneBox(all,inner){
  $('done').innerHTML='<div class="dbox" role="dialog" aria-modal="true"><div class="dbadge '+(all?'ok':'bad')+'">'+ic(all?'check':'x')+'</div>'+inner+'</div>';
  $('done').hidden=false;
}
function showDone(d,res){
  draftClear();
  const all=d.L.pass&&d.H.pass;
  const line=(l,x)=>'<div class="dline '+(x.pass?'ok':'bad')+'"><span>Control-'+l+'</span><span>'+(x.pass?'ผ่าน':'ไม่ผ่าน: '+esc(x.fails.join(', ')))+'</span></div>';
  const info='<p class="sub" style="margin-top:12px">สาขา'+esc(d.branch)+' · บันทึกลงชีต '+esc(res.tab)+' แล้ว ('+(d.only?'1 แถว':'2 แถว')+')</p>'+
    (res.demo?'<p class="demo">โหมดตัวอย่าง: หน้านี้ยังไม่ได้ต่อกับ Google Sheet จึงไม่ได้บันทึกข้อมูลจริง</p>':'');
  const head=(d.only?'':line('L',d.L)+line('H',d.H));
  const headR=['L','H'].filter(l=>!state.rerun||state.rerun.lv.includes(l)).map(l=>line(l,d[l])).join('');
  if(state.rerun){
    /* รอบที่กรอกซ้ำ → ต้องระบุสาเหตุ/การแก้ไข/ผล แล้วส่ง (ทำซ้ำได้รอบเดียว) */
    state.last=d;
    doneBox(all,'<h2>'+(all?'กรอกซ้ำแล้วผ่าน':'กรอกซ้ำแล้วยังไม่ผ่าน')+'</h2>'+headR+info+
      '<p class="fxline">ขั้นต่อไป: ระบุสาเหตุและการแก้ไข</p><button type="button" class="btn pri" id="fixgo">ระบุสาเหตุและการแก้ไข</button>');
    $('fixgo').onclick=()=>{
      state.fxCtx={round:1,failDate:state.rerun.failDate,failTime:state.rerun.failTime,failItems:state.rerun.failItems};
      if(!state.fxd)state.fxd={causes:[],causeOther:'',acts:[],actOther:'',note:'',res:'',resOther:''};
      showFix();
    };
    return;
  }
  if(all){
    doneBox(true,'<h2>QC ผ่านทั้งหมด</h2>'+head+info+'<p class="fxline">บันทึกเรียบร้อย ถ้าจะบันทึกรายการใหม่ให้สแกนเข้าหน้านี้อีกครั้ง</p>');
    return;
  }
  /* รอบแรกไม่ผ่าน → ต้องกรอกซ้ำก่อน ยังไม่ถามสาเหตุ */
  doneBox(false,'<h2>QC ไม่ผ่าน</h2>'+head+info+
    '<p class="fxline">ต้องกรอก QC ซ้ำเฉพาะ Control ที่ไม่ผ่าน ('+['L','H'].filter(l=>!d[l].pass).join(' และ ')+') ก่อน แล้วค่อยระบุสาเหตุ</p><button type="button" class="btn pri" id="rerun">กรอก QC ซ้ำ</button>');
  $('rerun').onclick=()=>{
    const keep=state.info.name;
    const lv=['L','H'].filter(l=>!d[l].pass);
    state.rerun={round:1,lv,failDate:d.date,failTime:d.time,failItems:{L:d.L.fails.slice(),H:d.H.fails.slice()}};
    const prev=JSON.parse(JSON.stringify(state.vals));      // ระดับที่ผ่านแล้วใช้ค่ารอบแรก
    state.vals={L:{},H:{}};['L','H'].forEach(l=>{if(!lv.includes(l))state.vals[l]=prev[l];});
    state.remark='';nowFill();state.info.name=keep;
    $('done').hidden=true;go(lv[0]==='L'?1:2);
  };
}

/* ---------- ฟอร์มบันทึกการแก้ไข (ร่วม L/H) ---------- */
const FX_OTHER='Others (โปรดระบุ)';
const fxGroups=()=>CFG.fx.groups.map((g,i,a)=>[g.g,i===a.length-1?g.items.concat([FX_OTHER]):g.items]);
const fxActs=()=>CFG.fx.acts.concat([FX_OTHER]);
const fxIsOther=l=>l===FX_OTHER;
function fxRow(kind,label,on){
  return '<label class="fxo'+(on?' on':'')+'"><input type="checkbox" data-fx="'+kind+'" value="'+esc(label)+'"'+(on?' checked':'')+'><span>'+esc(label)+'</span></label>';
}
function fxOtherInput(kind,x){
  const on=kind==='c'?x.causes.includes(FX_OTHER):x.acts.includes(FX_OTHER);
  return '<input class="sin fxt" id="fx-'+kind+'o" placeholder="โปรดระบุ" value="'+esc(kind==='c'?x.causeOther:x.actOther)+'"'+(on?'':' hidden')+'>';
}
const fxAuto=()=>state.last&&state.last.L.pass&&state.last.H.pass?'Pass':'Not Pass';
function fxResHTML(){
  const x=state.fxd,cur=x.res||fxAuto();
  const chip=v=>'<button type="button" class="chip'+(cur===v?' on':'')+'" data-fxres="'+v+'">'+v+'</button>';
  return '<div class="fxres">'+chip('Pass')+chip('Not Pass')+chip('Others')+'</div>'+
    (cur==='Others'?'<input class="sin fxt" id="fx-ro" placeholder="โปรดระบุผลการแก้ไข" value="'+esc(x.resOther)+'">':'');
}
function showFix(){
  const x=state.fxd,c=state.fxCtx,d=state.last;
  const ft=['L','H'].filter(l=>c.failItems[l].length).map(l=>'Control-'+l+': '+c.failItems[l].join(', ')).join('  ·  ');
  const rt=['L','H'].filter(l=>!state.rerun||state.rerun.lv.includes(l)).map(l=>'Control-'+l+' '+(d[l].pass?'ผ่าน':'ไม่ผ่าน ('+d[l].fails.join(', ')+')')).join('  ·  ');
  const causes=fxGroups().map(g=>'<div class="fxg">'+g[0]+'</div>'+g[1].map(l=>fxRow('c',l,x.causes.includes(l))+(fxIsOther(l)?fxOtherInput('c',x):'')).join('')).join('');
  const acts=fxActs().map(l=>fxRow('a',l,x.acts.includes(l))+(fxIsOther(l)?fxOtherInput('a',x):'')).join('');
  $('fixv').innerHTML=
    '<div class="sh-top"><div class="wrap"><button type="button" class="iconbtn" data-fxact="close" aria-label="กลับ">'+ic('left')+'</button><h2>สาเหตุและการแก้ไข</h2></div></div>'+
    '<div class="wrap sh-body">'+
    '<div class="fxfail">รอบแรกไม่ผ่าน · '+esc(ft||'-')+'</div>'+
    '<div class="fxb" style="margin-top:8px"><b>รอบกรอกซ้ำ</b> · '+esc(rt)+'</div>'+
    '<div class="card" style="margin-top:12px"><label class="fl">'+ic('alert')+'สาเหตุปัญหา (เลือกได้หลายข้อ)</label>'+causes+'</div>'+
    '<div class="card" style="margin-top:12px"><label class="fl">'+ic('check')+'การแก้ไข (เลือกได้หลายข้อ)</label>'+acts+'</div>'+
    '<div class="card" style="margin-top:12px"><label class="fl">'+ic('target')+'ผลการแก้ไข <small style="font-weight:400;color:var(--mute)">(ระบบเลือกตามผลกรอกซ้ำ เปลี่ยนได้)</small></label><div id="fx-res">'+fxResHTML()+'</div></div>'+
    '<div class="card" style="margin-top:12px"><label class="fl" for="fx-note">'+ic('doc')+'คำอธิบาย (ถ้ามี)</label><textarea class="fxn" id="fx-note" placeholder="รายละเอียดเพิ่มเติม">'+esc(x.note)+'</textarea></div>'+
    '</div>'+
    '<div class="sh-dock"><div class="in"><button type="button" class="btn pri" data-fxact="go" id="fx-send"><span>ส่งข้อมูล</span>'+ic('check')+'</button></div></div>';
  $('fixv').hidden=false;$('fixv').scrollTop=0;
}
$('fixv').addEventListener('change',e=>{
  const t=e.target,x=state.fxd;
  if(!t.dataset.fx)return;
  const arr=t.dataset.fx==='c'?x.causes:x.acts,v=t.value,i=arr.indexOf(v);
  if(t.checked&&i<0)arr.push(v);else if(!t.checked&&i>=0)arr.splice(i,1);
  t.closest('.fxo').classList.toggle('on',t.checked);
  if(fxIsOther(v)){const o=$('fx-'+t.dataset.fx+'o');o.hidden=!t.checked;if(t.checked)o.focus();}
});
$('fixv').addEventListener('input',e=>{
  const t=e.target,x=state.fxd;
  if(t.id==='fx-co')x.causeOther=t.value;else if(t.id==='fx-ao')x.actOther=t.value;else if(t.id==='fx-note')x.note=t.value;else if(t.id==='fx-ro')x.resOther=t.value;
});
$('fixv').addEventListener('click',async e=>{
  const rs=e.target.closest('[data-fxres]');
  if(rs){state.fxd.res=rs.dataset.fxres;$('fx-res').innerHTML=fxResHTML();return;}
  const a=e.target.closest('[data-fxact]');if(!a)return;
  if(a.dataset.fxact==='close'){$('fixv').hidden=true;return;}
  if(state.saving)return;
  const x=state.fxd,res=x.res||fxAuto();
  if(!x.causes.length)return toast('เลือกสาเหตุปัญหาอย่างน้อย 1 ข้อ');
  if(x.causes.includes(FX_OTHER)&&!x.causeOther.trim())return toast('ระบุสาเหตุ (Others)');
  if(!x.acts.length)return toast('เลือกการแก้ไขอย่างน้อย 1 ข้อ');
  if(x.acts.includes(FX_OTHER)&&!x.actOther.trim())return toast('ระบุการแก้ไข (Others)');
  if(res==='Others'&&!x.resOther.trim())return toast('ระบุผลการแก้ไข (Others)');
  const c=state.fxCtx,d=state.last,i=state.info;
  const payload={branch:state.branch,date:d.date,time:d.time,name:i.name.trim(),L:{pass:d.L.pass},H:{pass:d.H.pass},
    fix:{round:c.round,failDate:c.failDate,failTime:c.failTime,failItems:c.failItems,causes:x.causes,causeOther:x.causeOther.trim(),acts:x.acts,actOther:x.actOther.trim(),note:x.note.trim(),result:res,resultOther:res==='Others'?x.resOther.trim():''}};
  state.saving=true;const btn=$('fx-send');btn.disabled=true;
  try{
    if(API_URL){const j=await post({action:'save_fix',payload});if(!j.ok)throw new Error(j.error||'บันทึกไม่สำเร็จ');}
    else await new Promise(r=>setTimeout(r,500));
    $('fixv').hidden=true;
    const all=d.L.pass&&d.H.pass;
    doneBox(all,'<h2>บันทึกการแก้ไขแล้ว</h2><div class="dline '+(res==='Pass'?'ok':'bad')+'"><span>ผลการแก้ไข</span><span>'+esc(res==='Others'?'Others: '+x.resOther.trim():res)+'</span></div>'+
      (API_URL?'':'<p class="demo">โหมดตัวอย่าง: ยังไม่ได้บันทึกลงชีตจริง</p>')+'<p class="fxline">บันทึกเรียบร้อย ถ้าจะบันทึกรายการใหม่ให้สแกนเข้าหน้านี้อีกครั้ง</p>');
  }catch(err){toast('ส่งไม่สำเร็จ: '+(err&&err.message||'ลองใหม่อีกครั้ง'));btn.disabled=false;}
  finally{state.saving=false;}
});
/* แถบบอกว่ากำลังกรอกซ้ำ */
function fixBar(){
  if(!state.rerun)return '';
  const f=state.rerun.failItems;
  const t=['L','H'].filter(l=>f[l].length).map(l=>'Control-'+l+': '+f[l].join(', ')).join(' · ');
  return '<div class="fxb"><b>กรอก QC ซ้ำ Control-'+state.rerun.lv.join(' และ ')+'</b> เท่านั้น<br>รอบแรกไม่ผ่าน: '+esc(t)+'</div>';
}


/* ---------- ตั้งค่า (ต้องใส่รหัสผ่าน) ---------- */
let DEMO_CODE='1234',ADMIN_CODE='',WC=null,openSec={crit:true};
const clone=o=>JSON.parse(JSON.stringify(o));
const post=body=>fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(r=>r.json());
document.addEventListener('click',e=>{if(e.target.closest('#open-settings'))openGate();});

function openGate(){
  $('gate').innerHTML='<div class="gbox" role="dialog" aria-modal="true"><div class="gh"><i class="c1"></i><i class="c2"></i><div class="gi">'+ic('lock')+'</div><h2>ตั้งค่าระบบ</h2></div><div class="gb"><p class="sub">ใส่รหัสผ่านเพื่อเข้าสู่การตั้งค่า</p>'+
    '<div class="gpw"><input class="gin" id="g-code" type="password" placeholder="รหัสผ่าน" autocomplete="off"><button type="button" class="geye" id="g-eye" aria-label="แสดงรหัสผ่าน"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><div class="gmsg" id="g-msg" role="alert"></div>'+
    '<div class="gbtns"><button type="button" class="btn" id="g-cancel">ยกเลิก</button><button type="button" class="btn pri" id="g-ok">เข้าสู่ระบบ</button></div>'+
    (API_URL?'':'<p class="demo">โหมดตัวอย่าง: รหัสคือ 1234</p>')+'</div></div>';
  $('gate').hidden=false;setTimeout(()=>$('g-code').focus(),50);
  $('g-eye').onclick=()=>{const c=$('g-code');c.type=c.type==='password'?'text':'password';c.focus();};
  $('g-cancel').onclick=()=>{$('gate').hidden=true;};
  const go=async()=>{
    const code=$('g-code').value.trim(),m=$('g-msg'),b=$('g-ok');b.disabled=true;m.textContent='';
    try{
      if(!API_URL){if(code!==DEMO_CODE)throw new Error('รหัสผ่านไม่ถูกต้อง');ADMIN_CODE=code;WC={cfg:clone(CFG),crit:clone(P)};}
      else{const j=await post({action:'admin_login',code});if(!j.ok)throw new Error(j.error||'รหัสผ่านไม่ถูกต้อง');ADMIN_CODE=code;WC={cfg:j.data.cfg,crit:j.data.criteria};if(!WC.cfg.alerts)WC.cfg.alerts=clone(CFG.alerts);if(!WC.cfg.fx)WC.cfg.fx=clone(CFG.fx);}
      $('gate').hidden=true;openSec={crit:true};showSettings();
    }catch(err){m.textContent=err.message||'เข้าสู่ระบบไม่สำเร็จ';b.disabled=false;}
  };
  $('g-ok').onclick=go;$('g-code').onkeydown=e=>{if(e.key==='Enter')go();};
}
const critSummary=p=>['L','H'].map(l=>l+': '+(p.num?(+p[l][0]).toFixed(p.dec)+' – '+(+p[l][1]).toFixed(p.dec):p[l].join(', '))).join('   ·   ');
function critEditor(p,i){
  return ['L','H'].map(l=>{
    const body=p.num
      ?'<div class="rg"><label>ต่ำสุด<input class="sin" type="number" step="any" inputmode="decimal" data-cn="'+i+':'+l+':0" value="'+p[l][0]+'"></label><label>สูงสุด<input class="sin" type="number" step="any" inputmode="decimal" data-cn="'+i+':'+l+':1" value="'+p[l][1]+'"></label></div>'
      :'<div class="chipsr">'+p.opts.map(o=>'<button type="button" class="sc'+(p[l].includes(o)?' on':'')+'" data-cc="'+i+':'+l+':'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';
    return '<div class="lvblock"><span class="tag '+l+'">'+ic('drop')+'Control-'+l+(p.num?' · ช่วงที่ผ่าน':' · ผลที่ผ่าน')+'</span>'+body+'</div>';
  }).join('');
}
function listRows(arr,attr){
  return arr.map((v,i)=>'<div class="lrow"><input class="sin" data-'+attr+'="'+i+'" value="'+esc(v)+'" placeholder="ชื่อ"><button type="button" class="iconbtn" data-sact="del-'+attr+':'+i+'" aria-label="ลบ">'+ic('trash')+'</button></div>').join('');
}
const AL_ROWS=[['failDays','ไม่ผ่านต่อเนื่อง','วัน'],['itemFails','รายการเดียวกันไม่ผ่านในเดือน','ครั้ง'],['missDays','ไม่ได้ทำ QC ติดต่อกัน','วันทำการ']];
function alEditor(c){

}
function fxEditor(c){
  const f=c.fx,last=f.groups.length-1;
  const rows=(arr,attr,del)=>arr.map((v,i)=>'<div class="lrow"><input class="sin" data-'+attr+'="'+i+'" value="'+esc(v)+'" placeholder="ชื่อ"><button type="button" class="iconbtn" data-sact="'+del+i+'" aria-label="ลบ">'+ic('trash')+'</button></div>');
  const g=f.groups.map((gr,gi)=>'<details class="crow" data-sec="fg'+gi+'"'+(openSec['fg'+gi]?' open':'')+'><summary><b>'+esc(gr.g||'(ไม่มีชื่อ)')+'</b><small>'+gr.items.length+' รายการ</small></summary><div class="secb">'+
    '<label class="lab">ชื่อกลุ่ม<input class="sin" data-fg="'+gi+'" value="'+esc(gr.g)+'"></label>'+

    (gi===last?'<div class="lrow"><input class="sin" value="'+esc(FX_OTHER)+'" disabled><span style="width:48px"></span></div>':'')+
    '<button type="button" class="addbtn" data-sact="add-fi:'+gi+'">'+ic('plus')+'เพิ่มสาเหตุ</button>'+
    '<button type="button" class="addbtn" style="color:var(--bad);border-color:var(--bad)" data-sact="del-fg:'+gi+'">'+ic('trash')+'ลบกลุ่มนี้</button></div></details>').join('');
  return '<div class="lab">สาเหตุปัญหา (แยกเป็นกลุ่ม)</div>'+g+
    '<button type="button" class="addbtn" data-sact="add-fg">'+ic('plus')+'เพิ่มกลุ่ม</button>'+
    '<div class="lab" style="margin-top:16px">การแก้ไข</div>'+rows(f.acts,'fa','del-fa:').join('')+
    '<div class="lrow"><input class="sin" value="'+esc(FX_OTHER)+'" disabled><span style="width:48px"></span></div>'+
    '<button type="button" class="addbtn" data-sact="add-fa">'+ic('plus')+'เพิ่มการแก้ไข</button>'+
    '<div class="infonote" style="margin-top:10px">'+ic('info')+'<span>"Others (โปรดระบุ)" อยู่ท้ายสุดเสมอ · ถ้าเปลี่ยนชื่อ ข้อมูลเก่าในชีตจะยังใช้ชื่อเดิม และสถิติDashboardจะแยกเป็นอีกรายการ</span></div>';
}

  const sec=(id,title,sub,body)=>'<details class="sec" data-sec="'+id+'"'+(openSec[id]?' open':'')+'><summary><span><b>'+title+'</b><small>'+sub+'</small></span></summary><div class="secb">'+body+'</div></details>';
  const crit=WC.crit.map((p,i)=>'<details class="crow" data-sec="c'+i+'"'+(openSec['c'+i]?' open':'')+'><summary><b>'+p.ab+'</b><span>'+p.name+'</span><small>'+critSummary(p)+'</small></summary><div class="secb">'+critEditor(p,i)+'</div></details>').join('');

    sec('nm','ผู้บันทึก','รายชื่อให้เลือกที่หน้ากรอก (กันสะกดชื่อไม่ตรงกัน)','<label class="tgl"><span>ให้เลือกชื่อจากรายชื่อ</span><input type="checkbox" id="cfg-mode"'+(c.nameMode?' checked':'')+'></label>'+listRows(c.names,'n')+'<button type="button" class="addbtn" data-sact="add-n">'+ic('plus')+'เพิ่มชื่อ</button>')+
    sec('ex','เตือน UC-Control ใกล้หมดอายุ','เตือนเมื่อ Exp เหลือไม่เกินกี่วัน','<div class="stepper"><button type="button" class="iconbtn" data-sact="days-m" aria-label="ลด">−</button><input class="sin" id="cfg-days" type="number" inputmode="numeric" min="1" max="365" value="'+c.expDays+'"><span>วัน</span><button type="button" class="iconbtn" data-sact="days-p" aria-label="เพิ่ม">+</button></div>')+
    sec('al','การเตือนบนDashboard','ตั้งว่าเกิดอะไรแล้วให้ขึ้นการแจ้งเตือน',alEditor(c)+'<div class="infonote" style="margin-top:10px">'+ic('info')+'<span>กรอกซ้ำแล้วยังไม่ผ่าน จะเตือนเสมอ</span></div>')+
    sec('fx','สาเหตุและการแก้ไข','รายการที่ให้เลือกในหน้าฟอร์มแก้ไข',fxEditor(c))+
    sec('rp','ข้อความในรายงาน','หัวรายงานและช่องลงนาม','<label class="lab">ชื่อหน่วยงาน<input class="sin" id="cfg-org" value="'+esc(c.report.org)+'"></label>'+sg)+
    sec('pw','เปลี่ยนรหัสผ่าน','ใช้ร่วมกับDashboardและการตั้งค่า','<label class="lab">รหัสเดิม<input class="sin" id="pw-old" type="password" autocomplete="off"></label><label class="lab" style="margin-top:8px">รหัสใหม่<input class="sin" id="pw-new" type="password" autocomplete="off"></label><label class="lab" style="margin-top:8px">ยืนยันรหัสใหม่<input class="sin" id="pw-new2" type="password" autocomplete="off"></label><button type="button" class="addbtn" data-sact="pass" style="border-style:solid">เปลี่ยนรหัสผ่าน</button>')+
    '<div class="infonote">'+ic('info')+'<span>Lot/Exp ของ UC-Control และ Strip เปลี่ยนได้ที่หน้าแรกโดยไม่ต้องใส่รหัส</span></div></div>'+
    '<div class="sh-dock"><div class="in"><button type="button" class="btn pri" data-sact="save">'+ic('save')+'<span>บันทึกการตั้งค่า</span></button></div></div>';
  $('settings').hidden=false;
}
function rerenderSettings(){const s=$('settings').scrollTop;showSettings();$('settings').scrollTop=s;}
$('settings').addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.sec)openSec[d.dataset.sec]=d.open;},true);
$('settings').addEventListener('click',e=>{
  const cc=e.target.closest('[data-cc]');
  if(cc){const[i,l,o]=cc.dataset.cc.split(':'),p=WC.crit[+i],ix=p[l].indexOf(o);if(ix>=0)p[l].splice(ix,1);else p[l].push(o);p[l]=p.opts.filter(x=>p[l].includes(x));rerenderSettings();return;}
  const a=e.target.closest('[data-sact]');if(!a)return;
  const[k,v,v2]=a.dataset.sact.split(':'),c=WC.cfg;
  if(k==='close'){$('settings').hidden=true;}
  else if(k==='add-b'){c.branches.push('');rerenderSettings();}
  else if(k==='del-b'){if(c.branches.length<=1)return toast('ต้องมีอย่างน้อย 1 สาขา');c.branches.splice(+v,1);rerenderSettings();}
  else if(k==='add-n'){c.names.push('');rerenderSettings();}
  else if(k==='del-n'){c.names.splice(+v,1);rerenderSettings();}
  else if(k==='days-m'||k==='days-p'){const x=parseInt($('cfg-days').value,10)||c.expDays;c.expDays=Math.max(1,Math.min(365,x+(k==='days-p'?5:-5)));$('cfg-days').value=c.expDays;}
  else if(k==='al-m'||k==='al-p'){c.alerts[v]=Math.max(1,Math.min(99,(parseInt(c.alerts[v],10)||1)+(k==='al-p'?1:-1)));rerenderSettings();}
  else if(k==='add-fg'){c.fx.groups.push({g:'กลุ่มใหม่',items:['']});openSec['fg'+(c.fx.groups.length-1)]=true;rerenderSettings();}
  else if(k==='del-fg'){if(c.fx.groups.length<=1)return toast('ต้องมีอย่างน้อย 1 กลุ่ม');c.fx.groups.splice(+v,1);rerenderSettings();}
  else if(k==='add-fi'){c.fx.groups[+v].items.push('');rerenderSettings();}
  else if(k==='del-fi'){c.fx.groups[+v].items.splice(+v2,1);rerenderSettings();}
  else if(k==='add-fa'){c.fx.acts.push('');rerenderSettings();}
  else if(k==='del-fa'){c.fx.acts.splice(+v,1);rerenderSettings();}
  else if(k==='save')saveSettings();
  else if(k==='pass')changePass();
});
$('settings').addEventListener('input',e=>{
  const t=e.target,c=WC.cfg;
  if(t.dataset.b!==undefined)c.branches[+t.dataset.b]=t.value;
  else if(t.dataset.n!==undefined)c.names[+t.dataset.n]=t.value;
  else if(t.dataset.sg!==undefined){const[i,f]=t.dataset.sg.split(':');c.report.signers[+i][f]=t.value;}
  else if(t.dataset.cn!==undefined){const[i,l,x]=t.dataset.cn.split(':');WC.crit[+i][l][+x]=t.value;}
  else if(t.dataset.al!==undefined)c.alerts[t.dataset.al]=t.value;
  else if(t.dataset.fg!==undefined)c.fx.groups[+t.dataset.fg].g=t.value;
  else if(t.dataset.fi!==undefined){const[gi,ii]=t.dataset.fi.split(':');c.fx.groups[+gi].items[+ii]=t.value;}
  else if(t.dataset.fa!==undefined)c.fx.acts[+t.dataset.fa]=t.value;
  else if(t.id==='cfg-org')c.report.org=t.value;
  else if(t.id==='cfg-days')c.expDays=t.value;
  else if(t.id==='cfg-mode')c.nameMode=t.checked;
});
async function saveSettings(){
  const c=WC.cfg;
  c.branches=c.branches.map(s=>s.trim()).filter(Boolean);
  if(!c.branches.length)return toast('ต้องมีอย่างน้อย 1 สาขา');
  if(new Set(c.branches).size!==c.branches.length)return toast('ชื่อสาขาซ้ำกัน');
  c.names=c.names.map(s=>s.trim()).filter(Boolean);
  if(new Set(c.names).size!==c.names.length)return toast('ชื่อผู้บันทึกซ้ำกัน');
  c.expDays=Math.max(1,Math.min(365,parseInt(c.expDays,10)||30));
  [['failDays',2],['itemFails',3],['missDays',2]].forEach(([k,d])=>{c.alerts[k]=Math.max(1,Math.min(99,parseInt(c.alerts[k],10)||d));});
  const uniq=a=>[...new Set(a.map(x=>String(x).trim()).filter(x=>x&&x!==FX_OTHER))];
  c.fx.groups=c.fx.groups.map(g=>({g:String(g.g).trim(),items:uniq(g.items)})).filter(g=>g.g);
  if(!c.fx.groups.length)return toast('ต้องมีอย่างน้อย 1 กลุ่มสาเหตุ');
  c.fx.acts=uniq(c.fx.acts);
  if(!c.fx.acts.length)return toast('ต้องมีการแก้ไขอย่างน้อย 1 รายการ');
  for(const p of WC.crit)for(const l of ['L','H']){
    if(p.num){const a=parseFloat(p[l][0]),b=parseFloat(p[l][1]);if(isNaN(a)||isNaN(b)||a>b)return toast(p.ab+' Control-'+l+': ช่วงไม่ถูกต้อง');p[l]=[a,b];}
    else if(!p[l].length)return toast(p.ab+' Control-'+l+': เลือกผลที่ผ่านอย่างน้อย 1 ค่า');
  }
  try{
    if(API_URL){const j=await post({action:'admin_save',code:ADMIN_CODE,cfg:c,criteria:WC.crit});if(!j.ok)throw new Error(j.error||'บันทึกไม่สำเร็จ');}
    Object.assign(CFG,clone(c));
    P=clone(WC.crit);P.forEach(p=>{if(p.num)p.ph='เช่น '+((p[('L')][0]+p.L[1])/2).toFixed(p.dec);});
    N=P.length;TOTAL=N*2;
    if(!CFG.branches.includes(state.branch)){state.branch='';applySetup({});try{localStorage.removeItem('qcBranch');}catch(e){}}
    $('settings').hidden=true;render();toast('บันทึกการตั้งค่าแล้ว');
  }catch(err){toast('บันทึกไม่สำเร็จ: '+(err&&err.message||'ลองใหม่'));}
}
async function changePass(){
  const o=$('pw-old').value,n=$('pw-new').value,n2=$('pw-new2').value;
  if(o!==ADMIN_CODE)return toast('รหัสเดิมไม่ถูกต้อง');
  if(n.length<4)return toast('รหัสใหม่ต้องยาวอย่างน้อย 4 ตัว');
  if(n!==n2)return toast('รหัสใหม่ไม่ตรงกัน');
  try{
    if(API_URL){const j=await post({action:'admin_pass',code:ADMIN_CODE,newCode:n});if(!j.ok)throw new Error(j.error||'เปลี่ยนรหัสไม่สำเร็จ');}
    else DEMO_CODE=n;
    ADMIN_CODE=n;['pw-old','pw-new','pw-new2'].forEach(id=>$(id).value='');
    toast('เปลี่ยนรหัสผ่านแล้ว (ใช้กับDashboardด้วย)');
  }catch(err){toast(err&&err.message||'เปลี่ยนรหัสไม่สำเร็จ');}
}

/* ---------- โหลดค่าตั้งค่าสาธารณะ (โหมดจริง) ---------- */
async function loadConfig(){
  if(!API_URL)return;
  try{const j=await apiGet('config');if(j&&j.ok&&j.data){['branches','names','nameMode','expDays','fx'].forEach(k=>{if(j.data[k]!==undefined)CFG[k]=j.data[k];});if(!CFG.branches.includes(state.branch))state.branch='';}}catch(err){}
}

/* ---------- โหลดเกณฑ์ผ่านจากแท็บ "เกณฑ์ผ่าน" ในชีต (โหมดจริง) ---------- */
async function loadCriteria(){
  if(!API_URL){ready=true;return;}
  try{
    const j=await apiGet('criteria');
    if(!j.ok||!j.data||!j.data.items||!j.data.items.length)throw new Error(j.error||'ไม่พบข้อมูลเกณฑ์');
    P=j.data.items;
    P.forEach(p=>{if(p.num)p.ph='เช่น '+((p.L[0]+p.L[1])/2).toFixed(p.dec);});
    N=P.length;TOTAL=N*2;
    critWarn=j.data.errors||[];
  }catch(err){
    critWarn=['โหลดเกณฑ์จากชีตไม่สำเร็จ ใช้เกณฑ์สำรองในหน้านี้แทน (ตรวจอินเทอร์เน็ตแล้วรีเฟรช)'];
  }
  ready=true;
}

{const d=draftGet();if(d&&d.vals&&['L','H'].some(l=>Object.keys(d.vals[l]||{}).length))state.draft=d;}
render();
Promise.all([loadCriteria(),loadConfig()]).then(()=>state.branch?selectBranch(state.branch):null).then(()=>{ if(state.step===0)render(); else{paintTop();paintDock();} });

/* คลื่นสีตอนกด/แตะ (เบา: เพิ่ม span ชั่วคราว ลบเองเมื่อจบแอนิเมชัน) */
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest&&e.target.closest('.chip,.br,.btn,.tile,.fxo');
  if(!t||t.disabled)return;
  const r=t.getBoundingClientRect(),d=Math.hypot(Math.max(e.clientX-r.left,r.right-e.clientX),Math.max(e.clientY-r.top,r.bottom-e.clientY))*2;
  const s=document.createElement('span');s.className='rip';
  s.style.cssText='left:'+(e.clientX-r.left)+'px;top:'+(e.clientY-r.top)+'px;width:'+d+'px;height:'+d+'px';
  t.appendChild(s);s.addEventListener('animationend',()=>s.remove());setTimeout(()=>s.remove(),900);
},{passive:true});
</script>
