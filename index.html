<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IQC Sysmex UC-1000</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F3F7F8; --card:#FFFFFF; --soft:#F6FAFB; --ink:#243746; --mute:#647A88; --line:#DCE8EB;
  --pri:#167D8D; --sec:#38A6AD; --deep:#15566B; --on-pri:#FFFFFF;
  --Lt:#D9F0F1; --Lc:#15566B; --Ht:#FCE5ED; --Hc:#A93566;
  --ok:#27865B; --okbg:#E4F3EB; --okline:#9BD2B4;
  --warn:#B97A12; --warnbg:#FDF3E1; --warnline:#E5A23C;
  --bad:#D65B65; --badbg:#FBEAEB; --badline:#EDA9AF;
  --shadow:0 14px 30px -20px rgba(21,86,107,.5);
  --font:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1D24; --card:#172831; --soft:#112229; --ink:#E6EFF2; --mute:#93A9B4; --line:#27404B;
  --pri:#2FA3AE; --sec:#5CC3C8; --deep:#A9E1E4; --on-pri:#08262C;
  --Lt:#1A3A42; --Lc:#A9E1E4; --Ht:#3A1F2B; --Hc:#F2A0BD;
  --ok:#4CC38A; --okbg:#14342A; --okline:#2C6A50;
  --warn:#F0B556; --warnbg:#382D14; --warnline:#8A6A22;
  --bad:#EE7F88; --badbg:#3C1F23; --badline:#7C3A41;
  --shadow:0 14px 30px -20px rgba(0,0,0,.7); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F1D24; --card:#172831; --soft:#112229; --ink:#E6EFF2; --mute:#93A9B4; --line:#27404B;
  --pri:#2FA3AE; --sec:#5CC3C8; --deep:#A9E1E4; --on-pri:#08262C;
  --Lt:#1A3A42; --Lc:#A9E1E4; --Ht:#3A1F2B; --Hc:#F2A0BD;
  --ok:#4CC38A; --okbg:#14342A; --okline:#2C6A50;
  --warn:#F0B556; --warnbg:#382D14; --warnline:#8A6A22;
  --bad:#EE7F88; --badbg:#3C1F23; --badline:#7C3A41;
  --shadow:0 14px 30px -20px rgba(0,0,0,.7); color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
.ic{width:1.15em;height:1.15em;flex:none}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== หัวหน้า: หน้าแรกเป็นแบนเนอร์ ส่วนหน้าอื่นเป็นแถบเล็ก ===== */
.hero{background:linear-gradient(140deg,#15566B 0%,#167D8D 62%,#38A6AD 100%);color:#fff;position:relative;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.hero:before{width:240px;height:240px;right:-70px;top:-90px}
.hero:after{width:150px;height:150px;left:-50px;bottom:-60px}
.hero .wrap{position:relative;z-index:1;padding-block:20px 66px}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mark{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center;flex:none}
.mark .ic{width:24px;height:24px}
.greet{font-size:13px;background:rgba(255,255,255,.18);border-radius:99px;padding:5px 12px;font-weight:500}
.eyebrow{margin:22px 0 2px;font-size:13px;opacity:.85;letter-spacing:.02em}
.hero h1{margin:0;font-size:clamp(22px,6.4vw,28px);line-height:1.25;font-weight:700;text-wrap:balance}
.hsub{margin:6px 0 0;font-size:14px;opacity:.9}
.bar{position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{padding-block:10px 4px}
.brow{display:flex;align-items:center;gap:10px}
.bar .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#15566B,#38A6AD)}
.bar .mark .ic{width:20px;height:20px}
.bt{min-width:0;flex:1}
.bt b{display:block;font-size:16px;line-height:1.2}
.bt span{font-size:12px;color:var(--mute)}
.cnts{display:flex;gap:6px;flex:none}
.cp{font-size:12.5px;font-weight:700;border-radius:99px;padding:3px 10px;font-variant-numeric:tabular-nums;background:var(--soft);color:var(--mute);border:1.5px solid var(--line)}
.cp.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.cp.full{background:var(--ok);border-color:var(--ok);color:#fff}
.rail{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.seg{border:0;background:none;padding:8px 0;cursor:pointer}
.seg i{display:block;height:6px;border-radius:6px;background:var(--line);transition:background .2s}
.seg.ok i{background:var(--ok)} .seg.bad i{background:var(--bad)}
.seg:focus-visible{outline:2px solid var(--pri);outline-offset:1px;border-radius:6px}

main{padding-block:18px 150px}
.pull{margin-top:-46px;position:relative;z-index:2}
.page{animation:rise .24s ease-out}
@keyframes rise{from{opacity:.3;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}*{transition:none!important;animation:none!important}}
.h2{margin:0;font-size:clamp(22px,6.4vw,27px);line-height:1.25;font-weight:700}
.sub{margin:3px 0 0;color:var(--mute);font-size:14px}

/* ===== หน้าแรก ===== */
.panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:2px;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:11px 14px;min-width:0;cursor:pointer}
.tile small,.fcard small{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mute);font-weight:600}
.tile b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.tile input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;background:none}
.tile:focus-within,.fcard:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
.fcard{display:flex;flex-direction:column;gap:2px;margin-top:10px;background:var(--soft);border:1.5px solid var(--line);border-radius:16px;padding:11px 14px}
.bare{width:100%;border:0;background:none;padding:2px 0;font-size:19px;font-weight:600;outline:none;min-width:0}
.bare::placeholder{color:var(--mute);opacity:.55;font-weight:400}
.hint{margin:6px 2px 0;font-size:12.5px;color:var(--mute)}
.lotcard{display:flex;align-items:center;gap:12px;margin-top:10px;border-radius:16px;padding:12px 12px 12px 14px;background:linear-gradient(135deg,var(--Lt),var(--soft));border:1.5px solid var(--line)}
.lotcard .li{width:40px;height:40px;border-radius:12px;background:var(--card);color:var(--pri);display:grid;place-items:center;flex:none}
.lotcard .lt{flex:1;min-width:0}
.lotcard small{display:block;font-size:12px;color:var(--mute);font-weight:600}
.lotcard b{display:block;font-size:20px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{font-size:13px;font-weight:700;border:1.5px solid var(--line);background:var(--card);color:var(--pri);border-radius:11px;padding:8px 12px;cursor:pointer;white-space:nowrap}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 12px;min-width:0}
.stp i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-style:normal;font-weight:700;font-size:13px;margin-bottom:6px}
.stp:nth-child(1) i{background:var(--Lt);color:var(--Lc)}
.stp:nth-child(2) i{background:var(--Ht);color:var(--Hc)}
.stp:nth-child(3) i{background:var(--okbg);color:var(--ok)}
.stp b{display:block;font-size:13.5px;line-height:1.25}
.stp span{font-size:12px;color:var(--mute);line-height:1.3;display:block;margin-top:1px}

/* ===== หัวข้อ Control + การ์ดรายการ ===== */
.band{display:flex;align-items:center;gap:14px;border-radius:22px;padding:16px;position:relative;overflow:hidden}
.band.L{background:var(--Lt);color:var(--Lc)} .band.H{background:var(--Ht);color:var(--Hc)}
.band .bl{width:52px;height:52px;border-radius:16px;background:var(--card);display:grid;place-items:center;font-size:28px;font-weight:700;flex:none}
.band h2{margin:0;font-size:23px;line-height:1.2}
.band p{margin:2px 0 0;font-size:13.5px;opacity:.9}
.item{position:relative;overflow:hidden;scroll-margin-top:170px;scroll-margin-bottom:130px}
.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--acc)}
.item.L{--acc:var(--sec)} .item.H{--acc:#D86C93}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:16px 16px 16px 20px;margin-top:12px;box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.card.ok{border-color:var(--okline);background:linear-gradient(var(--okbg),var(--okbg)),var(--card)}
.card.bad{border-color:var(--badline);background:linear-gradient(var(--badbg),var(--badbg)),var(--card)}
.card.miss{border-color:var(--warnline);background:var(--warnbg)}
.ch{display:flex;align-items:center;gap:10px}
.num{width:28px;height:28px;border-radius:9px;background:var(--soft);color:var(--mute);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none;border:1px solid var(--line)}
.ih{display:flex;align-items:baseline;flex-wrap:wrap;gap:0 10px;min-width:0;flex:1}
.ih b{font-size:22px;font-weight:700}
.ih span{color:var(--mute);font-size:13.5px}
.st{display:flex;align-items:center;gap:4px;font-weight:700;font-size:14px;min-height:24px;flex:none}
.st.ok{color:var(--ok)} .st.bad{color:var(--bad)}
.crit{display:flex;align-items:center;gap:6px;margin:10px 0 12px;font-size:13.5px;color:var(--mute)}
.crit b{color:var(--ink);font-weight:600}
.chips{display:grid;gap:8px}
.chip{min-height:58px;border:1.5px solid var(--line);background:var(--soft);border-radius:15px;font-size:clamp(17px,5vw,20px);font-weight:600;cursor:pointer;transition:transform .1s,background .15s,border-color .15s;padding:0 4px}
.chip:active{transform:scale(.95)}
.chip:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.chip.on{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.card.ok .chip.on{background:var(--ok);border-color:var(--ok);color:#fff}
.card.bad .chip.on{background:var(--bad);border-color:var(--bad);color:#fff}
.field{width:100%;height:62px;border:1.5px solid var(--line);border-radius:15px;padding:0 16px;background:var(--soft);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;transition:border-color .15s,box-shadow .15s}
textarea.field{height:auto;padding:12px 14px;resize:vertical;min-height:90px;line-height:1.5;font-size:16px;font-weight:400}
.field:focus{outline:none;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 4px color-mix(in srgb,var(--pri) 18%,transparent)}
.field::placeholder{color:var(--mute);opacity:.55;font-weight:400}
.rb{position:relative;height:8px;border-radius:8px;background:var(--line);margin:16px 4px 0}
.rb .bd{position:absolute;top:0;bottom:0;border-radius:8px;background:color-mix(in srgb,var(--ok) 55%,transparent)}
.rb .mk{position:absolute;top:-5px;width:4px;height:18px;border-radius:3px;background:var(--ink);transform:translateX(-50%);text-decoration:none;transition:left .15s}
.card.ok .mk{background:var(--ok)} .card.bad .mk{background:var(--bad)}
.rbl{position:relative;height:18px;margin:4px 4px 0;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.rbl span{position:absolute;transform:translateX(-50%)}

/* ===== สรุปผล ===== */
.verdict{display:flex;align-items:center;gap:14px;border-radius:22px;padding:18px;color:#fff}
.verdict.ok{background:linear-gradient(135deg,#1C6E4C,#34A476)}
.verdict.bad{background:linear-gradient(135deg,#B13E49,#E0707A)}
.verdict.miss{background:linear-gradient(135deg,#A8700F,#E5A23C)}
.verdict .vi{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;flex:none}
.verdict .vi .ic{width:28px;height:28px}
.verdict h2{margin:0;font-size:23px;line-height:1.2}
.verdict p{margin:2px 0 0;font-size:13.5px;opacity:.95}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.meta span{display:inline-flex;align-items:center;gap:5px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:500;max-width:100%}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.rc{border:1.5px solid var(--line);border-radius:18px;padding:14px;background:var(--card);min-width:0}
.rc.ok{border-color:var(--okline);background:var(--okbg)} .rc.bad{border-color:var(--badline);background:var(--badbg)} .rc.miss{border-color:var(--warnline);background:var(--warnbg)}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 11px 4px 8px;border-radius:99px;font-weight:700;font-size:13.5px}
.tag.L{background:var(--Lt);color:var(--Lc)} .tag.H{background:var(--Ht);color:var(--Hc)}
.rc .big{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:20px;font-weight:700}
.rc.ok .big{color:var(--ok)} .rc.bad .big{color:var(--bad)} .rc.miss .big{color:var(--warn)}
.rc small{display:block;margin-top:2px;font-size:12.5px;color:var(--mute);overflow-wrap:anywhere}
.tbl{padding:6px 14px 6px 18px}
.tr,.th{display:grid;grid-template-columns:minmax(0,1fr) 88px 88px;align-items:center;gap:8px}
.tr{padding:9px 0;border-top:1px solid var(--line)}
.tr b{font-size:15px} .tr em{font-style:normal;color:var(--mute);font-size:12.5px;display:block;line-height:1.2}
.th{padding:8px 0 4px;font-size:12px;font-weight:700;color:var(--mute);letter-spacing:.04em}
.th span:not(:first-child){text-align:center}
.pill{display:flex;align-items:center;justify-content:center;gap:4px;min-height:34px;border-radius:11px;font-size:14px;font-weight:600;background:var(--soft);color:var(--mute);font-variant-numeric:tabular-nums;border:0;width:100%;cursor:pointer;padding:0 4px}
.pill.ok{background:var(--okbg);color:var(--ok)} .pill.bad{background:var(--badbg);color:var(--bad)}
.pill .ic{width:1em;height:1em}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px;background:var(--okbg);color:var(--ok)}
.note .ic{margin-top:2px}
.note.warn{background:var(--warnbg);color:var(--warn)}
label.fl{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px}
.foot{margin:26px 0 0;text-align:center;font-size:12.5px;color:var(--mute)}

/* ===== แถบล่าง ===== */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:26px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(to top,var(--bg) 62%,transparent)}
.dock .in{max-width:528px;margin:0 auto;display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px}
.dock .in.solo{grid-template-columns:minmax(0,1fr)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:18px;border:1.5px solid var(--line);background:var(--card);font-size:17px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s;box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn.pri{border:0;background:linear-gradient(135deg,#15566B,#167D8D 55%,#38A6AD);color:#fff;box-shadow:0 14px 24px -14px var(--pri)}
.btn:disabled{opacity:.55}

/* ===== แจ้งเตือน / เสร็จสิ้น ===== */
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-140%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);transition:transform .3s,opacity .3s;opacity:0;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.done{position:fixed;inset:0;z-index:40;background:rgba(10,30,38,.62);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;padding:20px}
.dbox{background:var(--card);border-radius:28px;padding:30px 22px 22px;max-width:380px;width:100%;text-align:center;animation:pop .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.dbadge{width:84px;height:84px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;position:relative}
.dbadge.ok{background:var(--okbg);color:var(--ok)} .dbadge.bad{background:var(--badbg);color:var(--bad)}
.dbadge:after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid currentColor;opacity:0;animation:ring 1.2s ease-out .2s}
@keyframes ring{0%{opacity:.5;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}
.dbadge svg{width:42px;height:42px}
.dbadge path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s ease-out .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dbox h2{margin:0 0 12px;font-size:25px}
.dline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;border-radius:13px;background:var(--soft);margin-top:8px;font-size:14.5px;font-weight:600;text-align:left}
.dline.ok span:last-child{color:var(--ok)} .dline.bad span:last-child{color:var(--bad)}
.dbox .demo{margin:14px 0 0;font-size:12.5px;color:var(--warn);background:var(--warnbg);border-radius:10px;padding:8px 10px}
.dbox .btn{width:100%;margin-top:16px}
@media (min-width:600px){.chip{min-height:62px}}
@media (max-width:350px){.tr,.th{grid-template-columns:minmax(0,1fr) 74px 74px}.res{grid-template-columns:1fr}.steps{grid-template-columns:1fr}}
</style>

</head>
<body>
<header id="top"></header>
<main class="wrap"><div id="view"></div><p class="foot">พัฒนาโดย ทนพ.วรินทร แสงหิรัญรัตนา</p></main>
<nav class="dock"><div class="in" id="dockin">
  <button type="button" class="btn back" id="back" aria-label="ย้อนกลับ"></button>
  <button type="button" class="btn pri" id="next"></button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="done" id="done" hidden></div>

<script>
/* ---------- เกณฑ์ผ่าน (เรียงตามไฟล์ QC_Urine.xlsx) ---------- */
const S=['-','1+','2+','3+','4+'];
const LV=['L','H'];
let P=[
 {k:'URO',ab:'URO',name:'Urobilinogen',opts:['normal','1+','2+','3+','4+'],L:['normal'],H:['1+','2+','3+','4+']},
 {k:'BLD',ab:'BLD',name:'Blood',opts:S,L:['-'],H:['1+','2+','3+']},
 {k:'BIL',ab:'BIL',name:'Bilirubin',opts:S,L:['-','1+'],H:['1+','2+','3+']},
 {k:'KET',ab:'KET',name:'Ketones',opts:S,L:['-'],H:['1+','2+','3+']},
 {k:'GLU',ab:'GLU',name:'Glucose',opts:S,L:['-'],H:['1+','2+','3+']},
 {k:'PRO',ab:'PRO',name:'Protein',opts:S,L:['-'],H:['1+','2+','3+','4+']},
 {k:'pH',ab:'pH',name:'pH',num:true,dec:1,ph:'เช่น 5.5',L:[5.0,6.0],H:[7.0,9.0]},

 {k:'LEU',ab:'LEU',name:'Leukocytes',opts:S,L:['-'],H:['2+','3+']},
 {k:'SG',ab:'S.G',name:'Specific gravity',num:true,dec:3,ph:'เช่น 1.015',L:[1.000,1.025],H:[1.010,1.030]}
];
let N=P.length, TOTAL=N*2;
let critWarn=[];            // ข้อความเตือนเรื่องตารางเกณฑ์
let ready=false;            // true เมื่อโหลดเกณฑ์เสร็จ

/* ---------- สถานะ ----------
   step 0 = ข้อมูลทั่วไป, 1 = Control-L, 2 = Control-H, 3 = สรุปและบันทึก */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const state={step:0,info:{date:'',time:'',name:'',lot:''},vals:{L:{},H:{}},remark:'',showMiss:false,saving:false};
const lvOf=()=>state.step===1?'L':state.step===2?'H':null;
function nowFill(){const d=new Date();state.info.date=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());state.info.time=pad(d.getHours())+':'+pad(d.getMinutes());}
nowFill();

/* ---------- ตัวอย่าง: Lot ปัจจุบันที่ระบบจำไว้ (ของจริงดึงจากชีต) ---------- */
state.lotLocked=false;

/* ---------- วันที่/เวลาแบบไทย ---------- */
const MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thDate=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?(+m[3])+' '+MON[+m[2]-1]+' '+(+m[1]+543):'เลือกวันที่';};
const thTime=s=>s?s+' น.':'เลือกเวลา';
const greet=()=>{const h=new Date().getHours();return h<12?'สวัสดีตอนเช้า':h<16?'สวัสดีตอนบ่าย':h<19?'สวัสดีตอนเย็น':'สวัสดีตอนค่ำ';};

 check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',

 alert:'<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>',
 cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 lock:'<rect x="5" y="11" width="14" height="10" rx="3"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',

 doc:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 13h6M10 17h6"/>'
};
const ic=n=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[n]+'</svg>';

/* ---------- ตัดสินผ่าน/ไม่ผ่าน: true / false / null ---------- */
function judge(p,l){
  const v=state.vals[l][p.k];
  if(v===undefined||v==='')return null;
  if(p.num){const n=parseFloat(v);if(isNaN(n))return null;const[a,b]=p[l];return n>=a-1e-9&&n<=b+1e-9;}
  return p[l].includes(v);
}
const rangeText=(p,l)=>p.num?p[l][0].toFixed(p.dec)+' – '+p[l][1].toFixed(p.dec):p[l].join('   /   ');
function stat(){
  const fails={L:[],H:[]},cnt={L:0,H:0};
  P.forEach(p=>LV.forEach(l=>{const j=judge(p,l);if(j!==null)cnt[l]++;if(j===false)fails[l].push(p.ab);}));
  return{filled:cnt.L+cnt.H,fails,cnt};
}
function firstMissing(){
  for(const l of LV){const i=P.findIndex(p=>judge(p,l)===null);if(i>=0)return{l,i};}
  return null;
}

      '<p class="eyebrow">โรงพยาบาลระยอง</p><h1>IQC เครื่องตรวจวิเคราะห์ตะกอนปัสสาวะ</h1><p class="hsub">ยี่ห้อ Sysmex รุ่น UC-1000</p></div>';
    return;
  }
  t.className='bar';
  const cp=(k)=>'<span class="cp '+(s.cnt[k]===N?'full':lvOf()===k?'on':'')+'">'+k+' '+s.cnt[k]+'/'+N+'</span>';
  t.innerHTML='<div class="wrap"><div class="brow"><div class="mark">'+ic('flask')+'</div>'+
    '<div class="bt"><b>'+(l?'Control-'+l:'สรุปและบันทึก')+'</b><span>IQC · Sysmex UC-1000</span></div>'+
    '<div class="cnts">'+cp('L')+cp('H')+'</div></div>'+
    (l?'<div class="rail" id="rail">'+P.map((p,i)=>{const j=judge(p,l);
      return '<button type="button" class="seg '+(j===null?'':j?'ok':'bad')+'" data-scroll="'+i+'" aria-label="'+p.ab+'"><i></i></button>';}).join('')+'</div>':'<div style="height:8px"></div>')+'</div>';
}
/* ---------- แถบล่าง ---------- */
function paintDock(){
  const b=$('back'),n=$('next');
  b.hidden=state.step===0;
  $('dockin').classList.toggle('solo',state.step===0);
  b.innerHTML=ic('left');
  n.disabled=state.saving||!ready;
  if(state.step===0)n.innerHTML='<span>เริ่มกรอก Control-L</span>'+ic('right');
  else if(state.step===1)n.innerHTML='<span>ไปกรอก Control-H</span>'+ic('right');
  else if(state.step===2)n.innerHTML='<span>สรุปผล</span>'+ic('right');
  else n.innerHTML=ic('save')+'<span>'+(state.saving?'กำลังบันทึก...':'บันทึกผล')+'</span>';
}

/* ---------- หน้า 0: ข้อมูลทั่วไป ---------- */
function viewInfo(){
  const i=state.info;
  const lot=state.lotLocked
    ?'<div class="lotcard"><div class="li">'+ic('lock')+'</div><div class="lt"><small>Lot น้ำยา QC</small><b>'+esc(i.lot)+'</b></div><button type="button" class="mini" id="lot-change">เปลี่ยน Lot</button></div><p class="hint">ระบบจำ Lot นี้ไว้ให้ทุกเครื่อง จนกว่าจะกดเปลี่ยน</p>'

/* ---------- หน้า 1-2: รายการของ Control-L / Control-H ---------- */
function statHTML(j){return j===null?'':j?ic('check')+'ผ่าน':ic('x')+'ไม่ผ่าน';}
function rbHTML(p,l,i){
  const[a,b]=p[l],sp=b-a,mn=a-sp*.7,mx=b+sp*.7,pc=x=>+((x-mn)/(mx-mn)*100).toFixed(1);
  return '<div class="rb" aria-hidden="true"><i class="bd" style="left:'+pc(a)+'%;width:'+(pc(b)-pc(a))+'%"></i><u class="mk" id="m-'+i+'" hidden></u></div>'+
    '<div class="rbl" aria-hidden="true"><span style="left:'+pc(a)+'%">'+a.toFixed(p.dec)+'</span><span style="left:'+pc(b)+'%">'+b.toFixed(p.dec)+'</span></div>';
}
function patchMark(i,l){
  const p=P[i];if(!p.num)return;const m=$('m-'+i);if(!m)return;
  const n=parseFloat(state.vals[l][p.k]);if(isNaN(n)){m.hidden=true;return;}
  const[a,b]=p[l],sp=b-a,mn=a-sp*.7,mx=b+sp*.7;
  m.hidden=false;m.style.left=Math.max(2,Math.min(98,(n-mn)/(mx-mn)*100))+'%';
}
function itemHTML(p,l,i){
  const j=judge(p,l),v=state.vals[l][p.k];
  const cls=j===true?' ok':j===false?' bad':(state.showMiss&&j===null?' miss':'');
  let inp;
  if(p.num){
    inp='<input class="field" id="n-'+i+'" type="number" inputmode="decimal" step="any" placeholder="'+p.ph+'" value="'+(v===undefined?'':esc(v))+'" aria-label="'+p.ab+' Control-'+l+'">'+rbHTML(p,l,i);
  }else{
    inp='<div class="chips" style="grid-template-columns:'+p.opts.map(o=>o.length>2?'1.9fr':'1fr').join(' ')+'">'+
      p.opts.map(o=>'<button type="button" class="chip'+(v===o?' on':'')+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')+'</div>';
  }
  return '<div class="card item '+l+cls+'" id="c-'+i+'" data-i="'+i+'"><div class="ch"><span class="num">'+(i+1)+'</span><div class="ih"><b>'+p.ab+'</b><span>'+p.name+'</span></div>'+
    '<span class="st '+(j===true?'ok':j===false?'bad':'')+'" id="s-'+i+'">'+statHTML(j)+'</span></div>'+
    '<p class="crit">'+ic('target')+'<span>เกณฑ์ผ่าน <b>'+rangeText(p,l)+'</b></span></p>'+inp+'</div>';
}
function viewLevel(l){
  const next=l==='L'?'Control-H':'สรุปผล';
  return '<section class="page"><div class="band '+l+'"><div class="bl">'+l+'</div><div><h2>Control-'+l+'</h2><p>'+(l==='L'?'ระดับต่ำ (Low)':'ระดับสูง (High)')+' · กรอกให้ครบ '+N+' รายการ แล้วไปต่อที่ '+next+'</p></div></div>'+
    P.map((p,i)=>itemHTML(p,l,i)).join('')+
    '<div class="note" id="endn" hidden>'+ic('check')+'<span>กรอกครบ '+N+' รายการแล้ว กด “'+(l==='L'?'ไปกรอก Control-H':'สรุปผล')+'” ด้านล่างได้เลย</span></div></section>';
}
function patchCard(i,l){
  const j=judge(P[i],l),c=$('c-'+i);if(!c)return;
  c.classList.toggle('ok',j===true);c.classList.toggle('bad',j===false);c.classList.remove('miss');
  const st=$('s-'+i);st.className='st '+(j===true?'ok':j===false?'bad':'');st.innerHTML=statHTML(j);
  patchMark(i,l);
}
function patchEnd(){
  const l=lvOf(),e=$('endn');
  if(l&&e)e.hidden=stat().cnt[l]<N;
}
function scrollToItem(i){const el=$('c-'+i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
function scrollNext(i,l){
  let j=-1;
  for(let k=i+1;k<N;k++){if(judge(P[k],l)===null){j=k;break;}}
  if(j<0)j=P.findIndex(p=>judge(p,l)===null);
  if(j>=0)scrollToItem(j);
  else{const e=$('endn');if(e)e.scrollIntoView({behavior:'smooth',block:'center'});}
}

/* ---------- หน้า 3: สรุป ---------- */
function cell(p,i,l){
  const j=judge(p,l),v=state.vals[l][p.k];
  const body=j===null?'–':ic(j?'check':'x')+esc(v);
  return'<button type="button" class="pill '+(j===null?'':j?'ok':'bad')+'" data-jump="'+l+':'+i+'" aria-label="'+p.ab+' Control-'+l+'">'+body+'</button>';
}
function viewSummary(){
  const s=stat(),i=state.info;
  const miss=TOTAL-s.filled,nf=s.fails.L.length+s.fails.H.length;
  const vc=miss?'miss':nf?'bad':'ok';
  const vt=miss?'ยังกรอกไม่ครบ':nf?'มีรายการไม่ผ่าน':'ผ่านทุกรายการ';
  const vs=miss?'เหลืออีก '+miss+' ช่อง แตะช่องในตารางเพื่อกลับไปกรอก':nf?'ควรบันทึกการแก้ไขหรือการวัดซ้ำในหมายเหตุ':'ตรวจแล้วกดบันทึกผลได้เลย';
  const rc=l=>{
    const done=s.cnt[l]===N,bad=s.fails[l].length;
    const cls=!done?'miss':bad?'bad':'ok';
    const txt=!done?'ยังไม่ครบ':bad?'ไม่ผ่าน '+bad:'ผ่าน';
    const sm=!done?'กรอกแล้ว '+s.cnt[l]+' / '+N:bad?s.fails[l].join(', '):'ทุกรายการอยู่ในเกณฑ์';
    return'<div class="rc '+cls+'"><span class="tag '+l+'">'+ic('drop')+'Control-'+l+'</span><div class="big">'+ic(!done?'alert':bad?'x':'check')+txt+'</div><small>'+esc(sm)+'</small></div>';
  };
  const rows=P.map((p,k)=>'<div class="tr"><span><b>'+p.ab+'</b><em>'+p.name+'</em></span>'+cell(p,k,'L')+cell(p,k,'H')+'</div>').join('');
  return '<section class="page"><div class="verdict '+vc+'"><div class="vi">'+ic(miss?'alert':nf?'x':'check')+'</div><div><h2>'+vt+'</h2><p>'+vs+'</p></div></div>'+
    '<div class="meta"><span>'+ic('cal')+thDate(i.date)+'</span><span>'+ic('clock')+thTime(i.time)+'</span><span>'+ic('user')+(esc(i.name)||'ยังไม่ระบุ')+'</span><span>'+ic('drop')+'Lot '+(esc(i.lot)||'–')+'</span></div>'+
    '<div class="res">'+rc('L')+rc('H')+'</div>'+
    '<div class="card tbl"><div class="th"><span>รายการ</span><span>L</span><span>H</span></div>'+rows+'</div>'+
    '<div class="card"><label class="fl" for="f-remark">'+ic('doc')+'หมายเหตุ / การแก้ไข</label><textarea class="field" id="f-remark" placeholder="เช่น วัดซ้ำแล้วผ่าน / เปลี่ยนน้ำยา">'+esc(state.remark)+'</textarea></div></section>';
}

/* ---------- วาดหน้า / เปลี่ยนหน้า ---------- */
function render(){
  const l=lvOf();
  $('view').innerHTML=state.step===0?viewInfo():l?viewLevel(l):viewSummary();
  paintTop();paintDock();patchEnd();
  if(l)P.forEach((p,i)=>patchMark(i,l));
}
function go(n,noTop){
  state.step=Math.max(0,Math.min(3,n));
  state.showMiss=false;
  render();
  if(!noTop)window.scrollTo({top:0,behavior:'smooth'});
}
function goItem(l,i,markMiss){
  go(l==='L'?1:2,true);
  if(markMiss){
    state.showMiss=true;
    P.forEach((p,k)=>{if(judge(p,l)===null){const c=$('c-'+k);if(c)c.classList.add('miss');}});
  }
  setTimeout(()=>scrollToItem(i),60);
}
function toast(m){
  const t=$('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('show'),2600);
}

/* ---------- เหตุการณ์ ---------- */
$('view').addEventListener('click',e=>{
  if(e.target.closest('#lot-change')){state.lotLocked=false;render();setTimeout(()=>{const f=$('f-lot');if(f){f.focus();f.select();}},50);return;}
  const j=e.target.closest('[data-jump]');
  if(j){const[l,i]=j.dataset.jump.split(':');goItem(l,+i,false);return;}
  const c=e.target.closest('.chip'),l=lvOf();
  if(c&&l){
    const card=c.closest('.item'),i=+card.dataset.i,p=P[i];
    const was=judge(p,l)!==null;
    state.vals[l][p.k]=c.dataset.v;
    card.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
    patchCard(i,l);paintTop();patchEnd();
    if(!was)setTimeout(()=>{if(lvOf()===l)scrollNext(i,l);},380);
  }
});
$('view').addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-date'){state.info.date=t.value;$('v-date').textContent=thDate(t.value);}
  else if(t.id==='f-time'){state.info.time=t.value;$('v-time').textContent=thTime(t.value);}
  else if(t.id==='f-name')state.info.name=t.value;
  else if(t.id==='f-lot')state.info.lot=t.value;
  else if(t.id==='f-remark')state.remark=t.value;
  else if(t.id.slice(0,2)==='n-'&&lvOf()){
    const i=+t.id.slice(2),l=lvOf();
    state.vals[l][P[i].k]=t.value;patchCard(i,l);paintTop();patchEnd();
  }
});
$('view').addEventListener('keydown',e=>{
  const t=e.target,l=lvOf();
  if(e.key==='Enter'&&l&&t.id&&t.id.slice(0,2)==='n-'){
    e.preventDefault();const i=+t.id.slice(2);
    if(judge(P[i],l)!==null){t.blur();scrollNext(i,l);}
  }
});
$('top').addEventListener('click',e=>{const g=e.target.closest('[data-scroll]');if(g)scrollToItem(+g.dataset.scroll);});
$('back').onclick=()=>go(state.step-1);
$('next').onclick=()=>{
  const l=lvOf();
  if(state.step===0){
    if(!state.info.name.trim()){toast('กรอกชื่อผู้บันทึกก่อน');const f=$('f-name');if(f)f.focus();return;}
    if(!state.info.lot.trim()){toast('กรอก Lot ก่อน');const f=$('f-lot');if(f)f.focus();return;}
    go(1);
  }else if(l){
    const s=stat();
    if(s.cnt[l]<N){
      const i=P.findIndex(p=>judge(p,l)===null);
      goItem(l,i,true);
      toast('Control-'+l+' ยังเหลือ '+(N-s.cnt[l])+' รายการ');
      return;
    }
    go(state.step+1);
  }else save();
};

/* ---------- บันทึก ---------- */
async function save(){
  if(state.saving)return;
  const i=state.info,s=stat();
  if(!i.name.trim()){toast('กรอกชื่อผู้บันทึกก่อน');go(0);return;}
  if(!i.lot.trim()){toast('กรอก Lot ก่อน');go(0);return;}
  if(s.filled<TOTAL){const m=firstMissing();toast('ยังกรอกไม่ครบ '+(TOTAL-s.filled)+' ช่อง');goItem(m.l,m.i,true);return;}
  const data={date:i.date,time:i.time,name:i.name.trim(),lot:i.lot.trim(),remark:state.remark.trim(),
    L:{values:state.vals.L,fails:s.fails.L,pass:s.fails.L.length===0},
    H:{values:state.vals.H,fails:s.fails.H,pass:s.fails.H.length===0}};
  try{localStorage.setItem('qcName',data.name);}catch(e){}
  state.saving=true;paintDock();
  try{
    let res;
    if(API_URL){
      const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'save',payload:data})});
      const j=await r.json();if(!j.ok)throw new Error(j.error||'บันทึกไม่สำเร็จ');res=j.data;
    }else{
      await new Promise(r=>setTimeout(r,600));res={tab:data.date.slice(0,7),demo:true};
    }
    showDone(data,res);
  }catch(err){
    toast('บันทึกไม่สำเร็จ: '+(err&&err.message?err.message:'ลองใหม่อีกครั้ง'));
  }finally{state.saving=false;paintDock();}
}
function showDone(d,res){
  const all=d.L.pass&&d.H.pass;
  const line=(l,x)=>'<div class="dline '+(x.pass?'ok':'bad')+'"><span>Control-'+l+'</span><span>'+(x.pass?'ผ่าน':'ไม่ผ่าน: '+esc(x.fails.join(', ')))+'</span></div>';
  $('done').innerHTML='<div class="dbox" role="dialog" aria-modal="true"><div class="dbadge '+(all?'ok':'bad')+'">'+ic(all?'check':'x').replace('width','width')+'</div>'+
    '<h2>'+(all?'QC ผ่านทั้งหมด':'QC ไม่ผ่าน')+'</h2>'+line('L',d.L)+line('H',d.H)+
    '<p class="sub" style="margin-top:12px">บันทึกลงชีต '+esc(res.tab)+' แล้ว (2 แถว)</p>'+
    (res.demo?'<p class="demo">โหมดตัวอย่าง: หน้านี้ยังไม่ได้ต่อกับ Google Sheet จึงไม่ได้บันทึกข้อมูลจริง</p>':'')+
    '<button type="button" class="btn pri" id="again">บันทึกรายการใหม่</button></div>';
  $('done').hidden=false;
  $('again').onclick=()=>{
    const keep={name:state.info.name,lot:state.info.lot};
    state.vals={L:{},H:{}};state.remark='';nowFill();state.info.name=keep.name;state.info.lot=keep.lot;state.lotLocked=!!keep.lot;
    $('done').hidden=true;go(0);
  };
}

/* ---------- โหลดเกณฑ์ผ่าน + Lot ปัจจุบันจากชีต ---------- */
const apiGet=a=>fetch(API_URL+(API_URL.indexOf('?')>=0?'&':'?')+'action='+a).then(r=>r.json());
async function loadCriteria(){
  if(!API_URL){ready=true;return;}
  try{
    const j=await apiGet('criteria');
    if(!j.ok||!j.data||!j.data.items||!j.data.items.length)throw new Error(j.error||'ไม่พบข้อมูลเกณฑ์');
    P=j.data.items;
    P.forEach(p=>{if(p.num)p.ph='เช่น '+((p.L[0]+p.L[1])/2).toFixed(p.dec);});
    N=P.length;TOTAL=N*2;
    critWarn=j.data.errors||[];
  }catch(err){
    critWarn=['โหลดเกณฑ์จากชีตไม่สำเร็จ ใช้เกณฑ์สำรองในหน้านี้แทน (ตรวจอินเทอร์เน็ตแล้วรีเฟรช)'];
  }
  ready=true;
}
async function loadLot(){
  if(!API_URL)return;
  try{
    const j=await apiGet('lot');
    const lot=j&&j.ok&&j.data&&j.data.lot;
    if(lot&&!state.info.lot){state.info.lot=String(lot);state.lotLocked=true;}
  }catch(err){}
}

render();
Promise.all([loadCriteria(),loadLot()]).then(()=>{ if(state.step===0)render(); else{paintTop();paintDock();} });
</script>
</body>
</html>
